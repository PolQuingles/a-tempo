name: Calendari
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendari
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Genera el calendari i la identitat del cor
        env:
          CAL_REFRESH_TOKEN: ${{ secrets.CAL_REFRESH_TOKEN }}
          CHOIR_ID: ${{ secrets.CHOIR_ID }}
        run: python3 .github/scripts/calendari.py
      - name: Desa si ha canviat
        run: |
          if [ -n "$(git status --porcelain calendari.ics marca marca.json manifest.webmanifest)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendari.ics marca marca.json manifest.webmanifest
            git commit -m "Calendari i identitat actualitzats"
            git pull --rebase origin main
            git push
          fi
