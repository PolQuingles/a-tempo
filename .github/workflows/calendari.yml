name: Calendari
# Cada tres hores: la identitat de cada agrupació (marca/), que es desa al repositori. Els calendaris (.ics) ja no: els fa la
# tasca «Publica», que ve just després, i només van a l'app publicada (vegeu .github/scripts/calendari.py).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendari
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: La identitat de cada agrupació
        env:
          SERVICE_REFRESH_TOKEN: ${{ secrets.SERVICE_REFRESH_TOKEN }}
          CAL_REFRESH_TOKEN: ${{ secrets.CAL_REFRESH_TOKEN }}
          CAL_FER: marca
        run: python3 .github/scripts/calendari.py
      - name: Desa si ha canviat
        run: |
          if [ -n "$(git status --porcelain marca marca.json manifest.webmanifest)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A marca marca.json manifest.webmanifest
            git commit -m "Identitat de les agrupacions"
            git pull --rebase origin main
            git push
          fi
