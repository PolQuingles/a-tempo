name: Calendari
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendari
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Genera calendari.ics
        env:
          CAL_REFRESH_TOKEN: ${{ secrets.CAL_REFRESH_TOKEN }}
          CHOIR_ID: ${{ secrets.CHOIR_ID }}
        run: python3 .github/scripts/calendari.py
      - name: Desa si ha canviat
        run: |
          if [ -n "$(git status --porcelain calendari.ics)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendari.ics
            git commit -m "Calendari actualitzat"
            git push
          fi
