name: Calendari
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendari
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Genera els calendaris i la identitat de cada agrupació
        env:
          SERVICE_REFRESH_TOKEN: ${{ secrets.SERVICE_REFRESH_TOKEN }}
          CAL_REFRESH_TOKEN: ${{ secrets.CAL_REFRESH_TOKEN }}
        run: python3 .github/scripts/calendari.py
      - name: Desa si ha canviat
        run: |
          if [ -n "$(git status --porcelain calendari.ics calendaris marca marca.json manifest.webmanifest)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A calendari.ics marca marca.json manifest.webmanifest
            if [ -e calendaris ] || git ls-files --error-unmatch calendaris >/dev/null 2>&1; then git add -A calendaris; fi
            git commit -m "Calendaris i identitat de les agrupacions"
            git pull --rebase origin main
            git push
          fi
