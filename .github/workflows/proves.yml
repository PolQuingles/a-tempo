name: Proves
# A cada canvi: les regles de seguretat de Firestore (a l'emulador), la interfície sencera en un navegador
# sense pantalla, la revisió de tipus del codi (TypeScript) i les proves de la lògica, i que les empremtes dels
# fitxers i els scripts estiguin bé. També cada matí, encara que no hi hagi canvis: algunes proves depenen del dia
# (de la setmana, del trimestre…) i així, si una falla un dia concret, se sap aquell mateix dia. Si falla, GitHub envia un correu.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proves-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regles:
    name: Regles de seguretat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Emulador de Firestore i proves de les regles
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-cor "python3 tests/regles/test_regles.py firestore.rules"
  interficie:
    name: Interfície
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: L'app tal com es publica (minificada)
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.24.0
          node tools/construeix.mjs dist
      - name: Navegador sense pantalla
        run: |
          pip install --quiet "playwright>=1.47,<2"
          python -m playwright install --with-deps chromium
      - name: Proves de la interfície (sobre l'app minificada)
        env:
          ATEMPO_DIST: dist
        run: python3 tests/interficie/run.py
  codi:
    name: Revisió del codi i lògica
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tipus (TypeScript revisa el JavaScript de l'app)
        run: npx --yes -p typescript@5.6 tsc -p tsconfig.json --pretty false
      - name: Lògica (percentatges, norma, importador, dates de classe, arxiu…)
        run: node tests/logica/run.js
      - name: La norma de l'app i la dels avisos diuen el mateix
        run: python3 tests/logica/test_norma.py
      - name: Avisos al mòbil entre passades (dades inventades, sense enviar res)
        run: python3 tests/logica/test_avisos.py
  estructura:
    name: Empremtes i scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Empremtes dels fitxers al dia
        run: python3 tools/stamp.py --check
      - name: Els scripts de Python compilen
        run: python3 -m py_compile .github/scripts/*.py tools/*.py tests/regles/*.py tests/interficie/*.py tests/logica/*.py
