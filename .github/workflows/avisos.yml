name: Avisos al mòbil
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: avisos
jobs:
  avisos:
    runs-on: ubuntu-24.04
    # La feina comença cada mitja hora i es queda oberta 26 minuts fent passades curtes cada 3 minuts (vegeu avisos.py),
    # perquè els missatges, les converses i les respostes a les absències arribin en pocs minuts. Al repositori públic, els
    # minuts de GitHub són gratuïts; si mai passa a privat, cal posar AVISOS_LOOP_MIN a 0 (vegeu el README).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pywebpush
      - name: Obre el repositori privat de còpies
        env:
          SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:PolQuingles/a-tempo-copies.git copies
          git -C copies config user.name "github-actions[bot]"
          git -C copies config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Envia els avisos
        env:
          SERVICE_REFRESH_TOKEN: ${{ secrets.SERVICE_REFRESH_TOKEN }}
          BACKUP_REFRESH_TOKEN: ${{ secrets.BACKUP_REFRESH_TOKEN }}
          PUSH_PRIVATE_KEY: ${{ secrets.PUSH_PRIVATE_KEY }}
          AVISOS_LOOP_MIN: '26'
          AVISOS_EVERY: '180'
        run: python3 .github/scripts/avisos.py copies
      - name: Desa què s'ha enviat
        working-directory: copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sense canvis"; else
            git commit -m "Avisos $(date -u +%FT%H:%M)"
            for i in 1 2 3; do git push origin HEAD:main && break || { git pull --rebase origin main; sleep 3; }; done
          fi
