<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cor Present</title>
<meta name="description" content="Llista d’assistència del cor per cordes i produccions.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5A3577">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cor Present">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..700;1,6..96,500..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F4F8; --surface:#FFFFFF; --surface-2:#F0EDF3; --line:#E3DEE8; --line-strong:#CFC7D7;
  --ink:#1D1822; --ink-2:#4A4350; --muted:#756E7C;
  --accent:#5A3577; --accent-ink:#FFFFFF; --accent-soft:#EEE6F4; --accent-line:#D6C6E3;
  --p:#1F9A57; --p-ink:#FFFFFF; --p-soft:#DDF2E5;
  --r:#62BDEB; --r-ink:#06324A; --r-soft:#DCEFFA;
  --fj:#F0A52A; --fj-ink:#3A2600; --fj-soft:#FCEDD3;
  --fnj:#D8433E; --fnj-ink:#FFFFFF; --fnj-soft:#FAE0DF;
  --np:#948D9A; --np-ink:#FFFFFF; --np-soft:#ECE9EF;
  --overlay:rgba(29,24,34,.42);
  --shadow:0 1px 2px rgba(29,24,34,.05), 0 10px 30px rgba(29,24,34,.10);
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --nav-h:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131016; --surface:#1C1820; --surface-2:#26212B; --line:#322C38; --line-strong:#463F4E;
    --ink:#EFEAF3; --ink-2:#CAC2D1; --muted:#9C94A4;
    --accent:#C9A7E6; --accent-ink:#1E1027; --accent-soft:#2D2337; --accent-line:#4A3A5A;
    --p:#36B96F; --p-ink:#04210F; --p-soft:#17301F;
    --r:#6CC4EF; --r-ink:#062A3D; --r-soft:#15293A;
    --fj:#F2AE3D; --fj-ink:#2E1E00; --fj-soft:#35290F;
    --fnj:#EC5E58; --fnj-ink:#2A0605; --fnj-soft:#3A1917;
    --np:#8A8390; --np-ink:#141117; --np-soft:#2B2631;
    --overlay:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131016; --surface:#1C1820; --surface-2:#26212B; --line:#322C38; --line-strong:#463F4E;
  --ink:#EFEAF3; --ink-2:#CAC2D1; --muted:#9C94A4;
  --accent:#C9A7E6; --accent-ink:#1E1027; --accent-soft:#2D2337; --accent-line:#4A3A5A;
  --p:#36B96F; --p-ink:#04210F; --p-soft:#17301F;
  --r:#6CC4EF; --r-ink:#062A3D; --r-soft:#15293A;
  --fj:#F2AE3D; --fj-ink:#2E1E00; --fj-soft:#35290F;
  --fnj:#EC5E58; --fnj-ink:#2A0605; --fnj-soft:#3A1917;
  --np:#8A8390; --np-ink:#141117; --np-soft:#2B2631;
  --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-inline:16px;padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App bar ---------- */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 12px}
.brand{min-width:0;display:flex;align-items:center;gap:12px}
.brand-logo{width:44px;height:44px;flex:none;object-fit:contain;border-radius:10px}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.help-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--accent)}
.brand-choir{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(22px, 6.4vw, 30px);line-height:1.08;letter-spacing:-.015em;color:var(--accent);text-wrap:balance}
@media (max-width:480px){ .sync[data-state="ok"] span{display:none} .sync[data-state="ok"]{padding:9px} }
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--p);flex:none}
.sync[data-state="saving"] i{background:var(--fj);animation:pulse 1s infinite}
.sync[data-state="local"] i{background:var(--np)}
.sync[data-state="error"] i{background:var(--fnj)}
.sync[data-state="loading"] i{background:var(--line-strong);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink);border-radius:var(--r-md);padding:10px 12px;font-size:13px;margin-block:0 12px}
.banner b{font-weight:600}
.banner.warn{background:var(--fnj-soft);border-color:transparent}

/* ---------- Bottom nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:760px;margin-inline:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tab-ico{background:var(--accent-soft)}
.tab-ico{position:relative;display:grid;place-items:center;width:52px;height:28px;border-radius:999px;transition:background .15s}
.tab-badge{position:absolute;top:-4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--fnj);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center}

/* ---------- Common ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 14px;flex-wrap:wrap}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.08;letter-spacing:-.015em}
.h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn-danger{background:var(--fnj);border-color:var(--fnj);color:var(--fnj-ink)}
.btn-danger-ghost{border-color:transparent;color:var(--fnj)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:26px 10px}

/* ---------- Roll call ---------- */
.ctx{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:4px 10px;border-bottom:1px solid transparent}
.ctx.stuck{border-bottom-color:var(--line)}
.session{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px}
.session-main{text-align:center;padding:6px 4px;border-radius:var(--r-md);min-width:0}
.session-main:hover{background:var(--surface-2)}
.session-prod{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-date{display:block;font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.12;letter-spacing:-.01em;margin-block:2px}
.session-meta{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.session-note{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:3px;text-wrap:balance}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--accent);color:var(--accent-ink)}
.badge.soft{background:var(--surface-2);color:var(--ink-2)}
.nav-arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.nav-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-arrow[disabled]{opacity:.3}

.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:3px}
.voice{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px 6px;border-radius:9px;color:var(--ink-2)}
.voice-l{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:22px;line-height:1}
.voice-n{font-size:11px;font-weight:600;letter-spacing:.01em;margin-top:2px}
.voice-c{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:1px}
.voice[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.voice[aria-selected="true"] .voice-c{color:inherit;opacity:.8}
.voice .done{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--p)}
.voice.off{opacity:.45}

.leader{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-block:14px 8px;flex-wrap:wrap}
.leader b{color:var(--ink);font-weight:600}

.tally{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.stack .s-P{background:var(--p)} .stack .s-R{background:var(--r)} .stack .s-FJ{background:var(--fj)} .stack .s-FNJ{background:var(--fnj)} .stack .s-NP{background:var(--np)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.i-P{background:var(--p)} .i-R{background:var(--r)} .i-FJ{background:var(--fj)} .i-FNJ{background:var(--fnj)} .i-NP{background:var(--np)} .i-none{background:transparent;border:1.5px dashed var(--line-strong)}
.tally-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.progress-txt{font-size:13px;color:var(--muted)}
.progress-txt b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}

.roster{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{padding:12px 12px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
summary::-webkit-details-marker{display:none}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.name{font-weight:600;font-size:16px;line-height:1.25}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.part{align-self:center;font-family:var(--f-mono);font-size:11px;line-height:18px;padding:0 5px;border-radius:6px;border:1px solid var(--line-strong);color:var(--ink-2)}
.state{font-size:12.5px;color:var(--muted);white-space:nowrap}
.state.warn{color:var(--r-ink);background:var(--r-soft);padding:1px 7px;border-radius:999px}
.row[data-s="none"] .name{color:var(--ink-2)}

.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:46px;padding:4px 2px;border-radius:10px;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.05;text-align:center;transition:background .12s, color .12s, transform .08s}
.opt i{width:8px;height:8px;border-radius:50%}
.opt:active{transform:scale(.96)}
.opt.o-P i{background:var(--p)} .opt.o-R i{background:var(--r)} .opt.o-FJ i{background:var(--fj)} .opt.o-FNJ i{background:var(--fnj)} .opt.o-NP i{background:var(--np)}
.opt[aria-checked="true"] i{background:currentColor;opacity:.9}
.opt.o-P[aria-checked="true"]{background:var(--p);color:var(--p-ink)}
.opt.o-R[aria-checked="true"]{background:var(--r);color:var(--r-ink)}
.opt.o-FJ[aria-checked="true"]{background:var(--fj);color:var(--fj-ink)}
.opt.o-FNJ[aria-checked="true"]{background:var(--fnj);color:var(--fnj-ink)}
.opt.o-NP[aria-checked="true"]{background:var(--np);color:var(--np-ink)}
.row.has-mark .opt[aria-checked="false"]{opacity:.62}

.extra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:10px;border-radius:10px}
.extra.x-R{background:var(--r-soft)}
.extra.x-FJ{background:var(--fj-soft)}
.extra.x-FNJ{background:var(--fnj-soft)}
.extra label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mins{display:flex;gap:6px;flex-wrap:wrap}
.min-chip{min-width:44px;height:34px;padding:0 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px}
.min-chip[aria-pressed="true"]{background:var(--r);border-color:var(--r);color:var(--r-ink);font-weight:500}
.min-input{width:74px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 8px;font-family:var(--f-mono);font-size:16px;text-align:center}
.note-input{flex:1 1 180px;min-width:0;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;font-size:16px}

.group-h{display:flex;justify-content:space-between;align-items:center;margin-block:22px 0;padding-inline:2px}
details.np-group{margin-top:0}
details.np-group summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 2px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
details.np-group summary::-webkit-details-marker{display:none}
details.np-group summary .chev{transition:transform .2s}
details.np-group[open] summary .chev{transform:rotate(180deg)}
.chev{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .h2, .empty .h1{color:var(--ink);margin-bottom:8px}
.empty p{max-width:34ch;margin:0 auto 18px}
.staff{display:block;width:120px;height:30px;margin:0 auto 18px;color:var(--accent-line)}

/* ---------- Calendar ---------- */
.cal-prod{margin-top:22px}
.cal-prod-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:2px;margin-bottom:6px}
.cal-month{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
.cal-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.cal-row:first-child{border-top:0}
.cal-main{flex:1;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 4px 10px 12px;text-align:left;min-width:0}
.cal-date{display:flex;flex-direction:column;align-items:center;line-height:1}
.cal-date b{font-family:var(--f-display);font-weight:600;font-size:24px}
.cal-date small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:lowercase}
.cal-info{min-width:0}
.cal-type{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-type em{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:12.5px;color:var(--muted);margin-left:4px}
.cal-place{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;line-height:1.35;color:var(--muted);overflow:hidden}
.cal-place .mono{font-size:12px;color:var(--ink-2)}
.cal-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.vmarks{display:flex;gap:3px}
.vm{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:11px;border:1.5px solid var(--line-strong);color:var(--muted)}
.vm.full{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vm.part{border-color:var(--accent);color:var(--accent);background:linear-gradient(to top, var(--accent-soft) 50%, transparent 50%)}
.vm.off{border-style:dotted;opacity:.4}
.cal-pct{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.cal-row.is-today{background:var(--accent-soft)}
.cal-row.is-today .cal-date b{color:var(--accent)}
.cal-row.is-past .cal-date b{color:var(--ink-2)}
.cal-row .icon-btn{margin-right:4px;flex:none}
.type-concert .cal-type{color:var(--accent)}

/* ---------- Stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi-v{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.kpi-v small{font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi-l{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.alert .kpi-v{color:var(--fnj)}

.bars{display:grid;gap:12px;padding:14px}
.bar-row{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:10px;font-size:13.5px}
.bar-row .lbl{display:flex;align-items:baseline;gap:6px;font-weight:600}
.bar-row .lbl em{font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--accent)}
.bar-row .val{font-family:var(--f-mono);font-size:13px;text-align:right}

.trend-wrap{overflow-x:auto;padding:14px 14px 10px}
.trend{position:relative;height:170px;display:flex;align-items:flex-end;gap:6px;padding-left:34px;min-width:100%}
.trend .grid{position:absolute;left:34px;right:0;border-top:1px dashed var(--line);pointer-events:none}
.trend .grid span{position:absolute;left:-34px;top:-8px;width:28px;text-align:right;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tcol{position:relative;flex:1 0 16px;max-width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.tbar{display:flex;flex-direction:column-reverse;border-radius:4px 4px 2px 2px;overflow:hidden;width:100%}
.tbar span{display:block;width:100%}
.tcol:hover .tbar, .tcol:focus-visible .tbar{outline:2px solid var(--ink);outline-offset:1px}
.tlabels{display:flex;gap:6px;padding-left:34px;margin-top:6px;min-width:100%}
.tlabels span{flex:1 0 16px;max-width:38px;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:visible}
.trend-note{font-size:12px;color:var(--muted);padding:0 14px 12px}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.alerts li:first-child{border-top:0}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.fnj{background:var(--fnj-soft);color:var(--fnj)}
.pill.r{background:var(--r-soft);color:var(--r-ink)}

.sortbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mtable{list-style:none;margin:0;padding:0}
.mrow{border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow button{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:11px 14px;text-align:left}
.mrow .mname{display:flex;align-items:baseline;gap:8px;min-width:0;font-weight:600}
.mrow .mname em{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:15px}
.mrow .mname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mpct{font-family:var(--f-mono);font-size:14px;font-weight:500;text-align:right}
.mrow .stack{grid-column:1 / -1;height:6px}
.mrow .mcounts{grid-column:1 / -1;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mrow .mcounts span{display:inline-flex;align-items:center;gap:5px}
.mrow .mcounts i{width:7px;height:7px;border-radius:2px}
.mrow .mcounts b{font-family:var(--f-mono);font-weight:500;color:var(--ink-2)}

.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.hcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.hcell i{width:100%;height:22px;border-radius:5px;background:var(--surface-2);border:1px dashed var(--line-strong)}
.hcell i.s-P{background:var(--p);border:0} .hcell i.s-R{background:var(--r);border:0} .hcell i.s-FJ{background:var(--fj);border:0} .hcell i.s-FNJ{background:var(--fnj);border:0} .hcell i.s-NP{background:var(--np);border:0}
.notes-list{list-style:none;margin:0;padding:0;font-size:13.5px}
.notes-list li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.notes-list li:first-child{border-top:0}

/* ---------- Manage ---------- */
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:6px}
.subtab{min-height:36px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li > button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;text-align:left;min-height:52px}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.li .dim{opacity:.55}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block:22px 8px;padding-inline:2px}
.sec-h .h2 em{font-style:italic;color:var(--accent);margin-right:6px}
.prod-card > button{display:block;padding:14px}
.prod-card .h2{font-size:20px}
.prod-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.prod-meta b{font-family:var(--f-mono);font-weight:500;color:var(--ink-2)}

.kv{display:grid;gap:14px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.setting:first-child{border-top:0}
.setting .t{font-weight:600}
.setting .s{font-size:12.5px;color:var(--muted);max-width:44ch}

/* ---------- Sheet ---------- */
.sheet-back{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h .h2{font-size:20px}
.sheet-b{padding:16px;overflow-y:auto;overscroll-behavior:contain}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .spacer{flex:1}
.grip{width:36px;height:4px;border-radius:4px;background:var(--line-strong);margin:8px auto 0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}

.field{display:grid;gap:6px}
.field > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field small{font-size:12px;color:var(--muted)}
.inp{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;font-size:16px}
textarea.inp{padding:10px 12px;min-height:120px;resize:vertical;line-height:1.4}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.pickers{display:flex;flex-wrap:wrap;gap:6px}
.pick{min-height:38px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick .vl{font-family:var(--f-display);font-style:italic;font-size:16px}
.fieldset{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:grid;gap:12px}
.fieldset legend{padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mini-list{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.mini-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 12px;border-top:1px solid var(--line);font-size:13.5px}
.mini-list li:first-child{border-top:0}
.mini-list .mono{font-size:12.5px;color:var(--muted)}
.picklist{list-style:none;margin:0;padding:0}
.picklist li + li{border-top:1px solid var(--line)}
.picklist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;text-align:left}
.picklist button[aria-current="true"]{color:var(--accent);font-weight:700}
.picklist .d{font-weight:600}
.picklist .m{font-size:12.5px;color:var(--muted)}
.summary-pre{width:100%;min-height:220px;font-family:var(--f-mono);font-size:13px;line-height:1.5;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);padding:12px;white-space:pre-wrap;resize:vertical}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow);animation:up .2s ease}
.toast button{color:var(--accent-line);font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.05em}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}


/* ---------- Pending lists, notices, rule ---------- */
.pending{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--fnj-soft);font-size:13px}
.pending b{font-weight:700;color:var(--fnj)}
.pending .chip{min-height:30px;padding:0 10px;font-size:12.5px;font-family:var(--f-mono);font-weight:500}
.voice .pend{position:absolute;top:5px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--fnj)}
.voice[aria-selected="true"] .pend{box-shadow:0 0 0 2px var(--accent)}
.notice{margin-top:10px;padding:10px;border-radius:10px;background:var(--accent-soft);border:1px dashed var(--accent-line);font-size:13px;display:grid;gap:8px}
.notice .n-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.notice .n-h b{color:var(--accent)}
.notice .n-a{display:flex;gap:6px;flex-wrap:wrap}
.rule{align-self:center;font-size:10.5px;font-weight:700;line-height:18px;padding:0 6px;border-radius:6px;white-space:nowrap}
.rule.out{background:var(--fnj-soft);color:var(--fnj)}
.rule.risk{background:var(--fj-soft);color:var(--fj-ink)}
.min-chip.now{font-family:var(--f-ui);font-weight:600;padding:0 10px}
.ro-state{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.ro-state i{width:10px;height:10px;border-radius:3px}
.abs-card{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.abs-card:first-child{border-top:0}
.abs-card .a-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.abs-card .a-d{display:flex;gap:6px;flex-wrap:wrap}
.abs-card .a-d span{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.abs-card .a-r{font-size:13.5px;color:var(--ink-2)}
.abs-card .a-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.st-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-pending{background:var(--fj-soft);color:var(--fj-ink)}
.st-accepted{background:var(--p-soft);color:var(--p)}
.st-rejected{background:var(--fnj-soft);color:var(--fnj)}
.checklist{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.checklist li + li{border-top:1px solid var(--line)}
.checklist label{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13.5px;cursor:pointer}
.checklist input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.checklist .m{font-size:12px;color:var(--muted)}
.checklist .mo{padding:8px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.leave-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-cta{display:grid;gap:10px;padding:18px;border-radius:var(--r-lg);background:var(--accent);color:var(--accent-ink);margin-top:8px}
.hero-cta .h2{color:inherit}
.hero-cta .btn{background:var(--surface);color:var(--accent);border-color:transparent;justify-self:start}
.me-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:10px}
.me-line b{color:var(--ink)}
.link-row .t small{font-weight:400;color:var(--muted)}

/* ---------- Roll overview: four quadrants ---------- */
.quads{display:grid;grid-template-columns:1fr 1fr;gap:1px;aspect-ratio:1/1;max-width:100%;width:min(100%, 520px);margin:16px auto 0;background:var(--line);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.quad{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface);color:var(--ink);padding:14px;transition:background .15s}
.quad:hover{background:var(--surface-2)}
.quad:active{background:var(--accent-soft)}
.q-l{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(58px, 19vw, 96px);line-height:.9;color:var(--accent)}
.q-n{font-size:15px;font-weight:600;margin-top:6px}
.q-c{font-family:var(--f-mono);font-size:15px;color:var(--ink-2)}
.q-bar{display:block;width:62%;height:5px;margin-top:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.q-bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.quad.is-done .q-bar span{background:var(--p)}
.q-dot{position:absolute;top:14px;width:11px;height:11px;border-radius:50%}
.q-dot.done{right:14px;background:var(--p)}
.q-dot.pend{left:14px;background:var(--fnj)}
.quad.off{background:var(--surface-2)}
.quad.off .q-l{color:var(--line-strong)}
.quad.off .q-n,.quad.off .q-c{color:var(--muted)}
.q-legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.q-legend span{display:inline-flex;align-items:center;gap:6px}
.q-legend i{width:9px;height:9px;border-radius:50%}
.day-panel{padding:16px;display:grid;gap:12px}
.day-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-big{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.day-big small{font-size:22px;color:var(--muted)}
.day-main .lbl{font-size:14px;color:var(--ink-2)}
.day-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.day-grid{grid-template-columns:repeat(4,1fr)}}
.day-grid div{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.day-grid i{width:10px;height:10px;border-radius:3px;grid-row:span 2}
.day-grid b{font-family:var(--f-mono);font-size:20px;font-weight:500;line-height:1.1}
.day-grid span{font-size:12px;color:var(--muted)}
.secbar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 8px 6px 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.secbar .back{padding:0 10px;min-height:36px}
.secbar-t{flex:1;display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:17px;min-width:0}
.secbar-t em{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--accent)}
.secbar .mono{font-size:14px;color:var(--ink-2)}
.session.compact .session-prod{display:none}
.session.compact .session-date{font-size:19px}
.session.compact .session-note{display:none}

/* ---------- Production tones (pastel per production) ---------- */
.prod-tone{--pbg:hsl(var(--ph) 70% 95%);--pbg2:hsl(var(--ph) 70% 89%);--pline:hsl(var(--ph) 40% 83%);--pdot:hsl(var(--ph) 55% 72%);--pink:hsl(var(--ph) 35% 32%)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .prod-tone{--pbg:hsl(var(--ph) 20% 16%);--pbg2:hsl(var(--ph) 24% 22%);--pline:hsl(var(--ph) 20% 27%);--pdot:hsl(var(--ph) 40% 52%);--pink:hsl(var(--ph) 55% 82%)}
}
:root[data-theme="dark"] .prod-tone{--pbg:hsl(var(--ph) 20% 16%);--pbg2:hsl(var(--ph) 24% 22%);--pline:hsl(var(--ph) 20% 27%);--pdot:hsl(var(--ph) 40% 52%);--pink:hsl(var(--ph) 55% 82%)}
.pdot{display:inline-block;flex:none;width:12px;height:12px;border-radius:4px;background:var(--pdot);vertical-align:baseline}
.cal-prod.prod-tone .cal-list{background:var(--pbg);border-color:var(--pline)}
.cal-prod.prod-tone .cal-row{border-top-color:var(--pline)}
.cal-prod.prod-tone .cal-row.is-today{background:var(--pbg2)}
.cal-prod.prod-tone .cal-month{color:var(--pink)}
.cal-prod.prod-tone .cal-prod-h .h2{display:flex;align-items:center;gap:10px}
.cal-prod.prod-tone .cal-prod-h .pdot{width:14px;height:14px}
.chip .pdot{margin-right:7px;width:10px;height:10px;border-radius:3px}
.hue-pick{width:36px;height:36px;border-radius:10px;border:2px solid transparent;background:var(--pbg2)}
.hue-pick[aria-pressed="true"]{border-color:var(--ink)}

/* ---------- Google sign-in, team, links ---------- */
.gbtn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px}
.gbtn svg{width:20px;height:20px}
.login-card{max-width:420px;margin:28px auto 0;padding:22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);display:grid;gap:12px;text-align:left}
.login-card .h2{font-size:20px}
.login-card p{margin:0;color:var(--ink-2);font-size:14px}
.login-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:4px 0}
.login-sep::before,.login-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.role-tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.linkbox{font-family:var(--f-mono);font-size:12px;word-break:break-all;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
/* ---------- Substitutes, confirmations ---------- */
.sub-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:-2px;margin-bottom:8px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);font-size:13px}

<script>
(() => {
'use strict';

/* ================= Constants ================= */
const SECTIONS = [
  { id: 'S', name: 'Sopranos' },
  { id: 'C', name: 'Contralts' },
  { id: 'T', name: 'Tenors' },
  { id: 'B', name: 'Baixos' },
];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const STATUS = {
  P:   { label: 'Assisteix',               short: 'Present' },
  R:   { label: 'Retard',                  short: 'Retard' },
  FNJ: { label: 'Falta no justificada',    short: 'No just.' },
  FJ:  { label: 'Falta justificada',       short: 'Justif.' },
  NP:  { label: 'No fa aquesta producció', short: 'No fa' },
};
const ORDER = ['P', 'R', 'FNJ', 'FJ', 'NP'];
const TYPES = ['Assaig', 'Assaig parcial', 'Assaig pregeneral', 'Assaig general', 'Assaig amb orquestra', 'Concert', 'Cap de setmana de treball', 'Viatge / intercanvi', 'Altres'];
const PARTS = ['1', '2', '1 o 2'];
const WEEKDAYS = [ ['1','dl'], ['2','dt'], ['3','dc'], ['4','dj'], ['5','dv'], ['6','ds'], ['0','dg'] ];
const LATE_CHIPS = [5, 10, 15, 20, 30];
const LS_UI = 'corpresent:ui:v1';
const COLS = ['members', 'productions', 'attendance'];

const ICON = {
  left: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  go: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
};

/* ================= Utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = isoDate(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = (s, o) => { try { return new Intl.DateTimeFormat('ca-ES', o).format(parseISO(s)); } catch { return s; } };
const capz = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const longDate = s => capz(fmtD(s, { weekday: 'long', day: 'numeric', month: 'long' }));
const shortDate = s => fmtD(s, { day: 'numeric', month: 'short' });
const ddmm = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '';
const timeRange = s => s.time ? (s.end ? `${s.time}–${s.end}` : s.time) : '';
const partTag = m => m.part ? `${m.section}${m.part.replace(' o ', '/')}` : '';
const wdShort = s => fmtD(s, { weekday: 'short' });
const monthYear = s => capz(fmtD(s, { month: 'long', year: 'numeric' }));
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const kpiPct = v => v == null ? '—' : `${Math.round(v * 100)}<small>%</small>`;
const byName = (a, b) => a.name.localeCompare(b.name, 'ca');

/* ================= State ================= */
const S = {
  mode: 'loading',          // loading | setup | nokey | badlink | shared
  ready: false,
  error: null,
  role: null,               // edit | view | singer
  uid: null,
  config: { name: '', alertFNJ: 3, minAttendance: 80, demo: false },
  members: new Map(),
  productions: new Map(),
  attendance: new Map(),
  absences: new Map(),
  staff: new Map(),       // email -> { email, name, role: admin|director|leader, section }
  subs: new Map(),        // <sessionId>_<corda> -> substitute for that roll call
  rsvp: new Map(),        // <sessionId>_<memberId> -> { answer: yes|no, note }
  secrets: null,
  secretsMembers: null,   // memberId -> personal link key
  me: null,               // staff record when signed in with Google
  memberId: null,         // singer's own member id (personal link)
};
const ui = {
  tab: 'llista', section: 'S', sessionId: null, rollSec: null,
  calProd: 'all', calPast: false,
  statsScope: 'prod', statsProd: null, statsTerm: null, statsSec: '', statsSort: 'pct',
  manage: 'cantaires', absFilter: 'pending',
};
function loadUI() {
  try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch {}
  ui.sessionId = null;
}
function saveUI() {
  try { localStorage.setItem(LS_UI, JSON.stringify({ tab: ui.tab, section: ui.section, calProd: ui.calProd, statsScope: ui.statsScope, statsSec: ui.statsSec, statsSort: ui.statsSort, manage: ui.manage })); } catch {}
}
const canEdit = () => S.role === 'edit';
const isAdmin = () => S.role === 'edit' && (!S.me || S.me.role === 'admin');
const STAFF_ROLES = { admin: 'Administració', director: 'Director', leader: 'Cap de corda' };
const subKey = (sid, sec) => `${sid}_${sec}`;
const subFor = (sid, sec) => S.subs.get(subKey(sid, sec));
/** Singer allowed to take today's roll for this session and corda. */
const isMySub = (sid, sec) => { const x = subFor(sid, sec); return S.role === 'singer' && !!x && x.memberId === S.memberId && x.until > Date.now(); };
const canMark = (s, sec) => canEdit() || (!!s && isMySub(s.id, sec));
const mySubs = () => [...S.subs.values()].filter(x => x.memberId === S.memberId && x.until > Date.now());

/* ================= Persistence (Firebase) ================= */
// Links carry a secret (#k=…). claus/<secret> says which choir it opens and with which role
// (edit: caps de corda · view: consulta · singer: avisos d'absència). Each device signs in
// anonymously and registers its role under cors/<choir>/access/<uid>; Firestore rules check it.
const LS_KEY = 'corpresent:clau';
const LS_LINK = 'corpresent:enllac';
const LS_ME = 'corpresent:jo';
const ROLE_NAME = { edit: 'Caps de corda i director', view: 'Consulta', singer: 'Cantaire' };
let db = null, fs = null, auth = null, LINK = null;   // LINK = { secret, choirId, role }
const queue = new Map();   // path -> { data | null, timer }  (debounce window)
let inflight = 0;

const SECRET_RE = /^[A-Za-z0-9_-]{24,64}$/;
function readSecret() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{24,64})/);
  if (m) return m[1];
  let saved = null;
  try { saved = localStorage.getItem(LS_KEY); } catch {}
  if (saved && SECRET_RE.test(saved)) { history.replaceState(null, '', `#k=${saved}`); return saved; }
  return null;
}
function rememberLink(link) {
  LINK = link;
  try { localStorage.setItem(LS_KEY, link.secret); localStorage.setItem(LS_LINK, JSON.stringify(link)); } catch {}
  history.replaceState(null, '', `#k=${link.secret}`);
}
function forgetLink() { try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_LINK); } catch {} }
function newKey() {
  const b = new Uint8Array(18);
  crypto.getRandomValues(b);
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const shareUrl = (secret = LINK?.secret) => `${location.origin}${location.pathname}#k=${secret}`;
window.addEventListener('hashchange', () => { const m = location.hash.match(/k=([A-Za-z0-9_-]{24,64})/); if (m && m[1] !== LINK?.secret) location.reload(); });

const isDirty = path => queue.has(path);

/** Write one document (data) or delete it (null). Local state must already be updated. */
function persist(col, id, data, delay = 350) {
  const path = `${col}/${id}`;
  const q = queue.get(path) || {};
  clearTimeout(q.timer);
  q.data = data === null ? null : clone(data);
  q.timer = setTimeout(() => flush(path), delay);
  queue.set(path, q);
  updateSync();
}
function flush(path) {
  const q = queue.get(path);
  if (!q || !db) return;
  queue.delete(path);
  inflight++;
  updateSync();
  // Firestore applies the write to its local cache at once (works offline) and syncs when there is signal.
  const p = q.data === null ? db.doc(path).delete() : db.doc(path).set(q.data);
  p.then(() => { S.syncErr = false; })
   .catch(writeFailed)
   .finally(() => { inflight--; updateSync(); });
}
function flushAll() { for (const path of [...queue.keys()]) { clearTimeout(queue.get(path).timer); flush(path); } }
function writeFailed(e) {
  const code = e && e.code;
  if (code === 'permission-denied') { S.error = 'No tens permís per desar aquest canvi. Potser l’enllaç s’ha renovat: demana’n el nou.'; renderBanner(); }
  else if (code === 'resource-exhausted') toast('S’ha arribat al límit diari de la base de dades. Torna-ho a provar demà.');
  else toast('Un canvi no s’ha pogut desar. Torna-ho a provar.');
  S.syncErr = true; updateSync();
}
const pendingWrites = () => queue.size + inflight;

function updateSync() {
  const el = $('#sync');
  let state = 'ok', text = 'Sincronitzat';
  if (S.mode === 'loading') { state = 'loading'; text = 'Connectant…'; }
  else if (S.mode !== 'shared') { state = 'local'; text = 'Sense cor'; }
  else if (!navigator.onLine) { state = 'local'; text = pendingWrites() ? 'Sense connexió · pendent' : 'Sense connexió'; }
  else if (pendingWrites()) { state = 'saving'; text = 'Desant…'; }
  else if (S.syncErr) { state = 'error'; text = 'Error en desar'; }
  else if (S.role && S.role !== 'edit') { state = 'ok'; text = ROLE_NAME[S.role]; }
  el.dataset.state = state;
  el.lastElementChild.textContent = text;
}
window.addEventListener('online', updateSync);
window.addEventListener('offline', updateSync);
window.addEventListener('pagehide', flushAll);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

function subscribe() {
  const staff = S.role === 'edit';
  const wanted = ['members', 'productions', 'config', 'absences', 'subs', 'rsvp'];
  if (staff) wanted.push('attendance', 'secrets', 'secretsMembers', 'staff');
  const loaded = new Set();
  const markLoaded = k => { loaded.add(k); if (loaded.size >= wanted.length && !S.ready) { S.ready = true; render(); } };
  const onCol = col => snap => {
    const next = new Map();
    for (const d of snap.docs) {
      const path = `${col}/${d.id}`;
      if (isDirty(path)) { if (S[col].has(d.id)) next.set(d.id, S[col].get(d.id)); }
      else next.set(d.id, d.data());
    }
    for (const [id, v] of S[col]) if (!next.has(id) && isDirty(`${col}/${id}`) && queue.get(`${col}/${id}`)?.data !== null) next.set(id, v);
    S[col] = next;
    if (col === 'subs' && !staff) watchSubAttendance();
    markLoaded(col);
    if (S.ready) scheduleRender();
  };
  const mine = col => staff ? db.collection(col) : db.collection(col).where('memberId', '==', S.memberId || '-');
  for (const col of ['members', 'productions']) db.collection(col).onSnapshot(onCol(col), onDbError);
  for (const col of ['absences', 'subs', 'rsvp']) mine(col).onSnapshot(onCol(col), e => { markLoaded(col); if (staff) onDbError(e); });
  if (staff) {
    db.collection('attendance').onSnapshot(onCol('attendance'), onDbError);
    db.collection('staff').onSnapshot(onCol('staff'), () => markLoaded('staff'));
    db.doc('secrets/main').onSnapshot(snap => { S.secrets = snap.exists ? snap.data() : null; markLoaded('secrets'); if (S.ready) scheduleRender(); }, () => markLoaded('secrets'));
    db.doc('secrets/members').onSnapshot(snap => { S.secretsMembers = snap.exists ? snap.data() : {}; markLoaded('secretsMembers'); if (S.ready) scheduleRender(); }, () => markLoaded('secretsMembers'));
  }
  db.doc('config/main').onSnapshot(snap => {
    if (!isDirty('config/main')) S.config = { name: '', alertFNJ: 3, minAttendance: 80, demo: false, ...(snap.exists ? snap.data() : {}) };
    markLoaded('config');
    if (S.ready) scheduleRender();
  }, onDbError);
}
/** A singer who is today's substitute listens to the attendance sheets they may fill in. */
const subWatchers = new Map();
function watchSubAttendance() {
  for (const sub of S.subs.values()) {
    if (sub.until < Date.now() || subWatchers.has(`${sub.sessionId}_${sub.section}`)) continue;
    const id = `${sub.sessionId}_${sub.section}`;
    subWatchers.set(id, db.doc(`attendance/${id}`).onSnapshot(snap => {
      if (!isDirty(`attendance/${id}`)) { if (snap.exists) S.attendance.set(id, snap.data()); else S.attendance.delete(id); }
      if (S.ready) scheduleRender();
    }, () => {}));
  }
}
function onDbError(e) {
  const code = e && e.code;
  S.error = code === 'permission-denied'
    ? 'Aquest enllaç ja no dona accés al cor. Demana l’enllaç nou.'
    : 'S’ha perdut la connexió amb les dades. Recarrega la pàgina.';
  if (!S.ready) { S.ready = true; }
  render();
}

/* ================= Derived data ================= */
function membersOf(sec, includeInactive = false) {
  return [...S.members.values()]
    .filter(m => (!sec || m.section === sec) && (includeInactive || m.active !== false))
    .sort((a, b) => (b.leader ? 1 : 0) - (a.leader ? 1 : 0) || byName(a, b));
}
/** Pastel hue per production: chosen in its sheet, or assigned by season order. */
const PROD_HUES = [265, 200, 150, 30, 330, 55, 180, 10, 95, 230];
function prodHue(p) {
  if (!p) return PROD_HUES[0];
  if (p.hue != null && p.hue !== '') return +p.hue;
  const i = productionsSorted().findIndex(x => x.id === p.id);
  return PROD_HUES[(i < 0 ? 0 : i) % PROD_HUES.length];
}
function productionsSorted() {
  return [...S.productions.values()].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
}
/** A session lives in one production and can also count for others (alsoIn). */
function withProd(s, p) { return { ...s, prodId: p.id, alsoIn: (s.alsoIn || []).filter(id => id !== p.id && S.productions.has(id)) }; }
function allSessions(prodId) {
  const out = [];
  for (const p of S.productions.values()) {
    for (const raw of (p.sessions || [])) {
      const s = withProd(raw, p);
      if (!prodId || prodId === 'all' || p.id === prodId || s.alsoIn.includes(prodId)) out.push(s);
    }
  }
  return out.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
}
function sessionById(id) {
  for (const p of S.productions.values()) {
    const s = (p.sessions || []).find(x => x.id === id);
    if (s) return withProd(s, p);
  }
  return null;
}
const sessionProds = s => [s.prodId, ...(s.alsoIn || [])];
const prodNames = s => sessionProds(s).map(id => S.productions.get(id)?.name).filter(Boolean).join(' + ');
const attKey = (sid, sec) => `${sid}_${sec}`;
const attDoc = (sid, sec) => S.attendance.get(attKey(sid, sec));
const isExcluded = (prodId, mid) => !!(S.productions.get(prodId)?.excluded || []).includes(mid);
const convoked = (s, sec) => !s.sections || !s.sections.length || s.sections.includes(sec);
const onLeave = (m, date) => (m.leaves || []).find(l => l.from && l.from <= date && (!l.to || l.to >= date));
/** Out of the roll for this session: on leave, or not doing any of its productions. */
const isOut = (s, m) => !!onLeave(m, s.date) || sessionProds(s).every(p => isExcluded(p, m.id));
/** Effective mark. ctxProd: when computing one production's stats, members outside it count as «No fa». */
function effMark(session, member, ctxProd) {
  if (ctxProd && isExcluded(ctxProd, member.id)) return { s: 'NP', auto: true, why: 'prod' };
  const m = attDoc(session.id, member.section)?.marks?.[member.id];
  if (m && m.s) return m;
  const lv = onLeave(member, session.date);
  if (lv) return { s: 'NP', auto: true, why: 'leave', leave: lv };
  if (sessionProds(session).every(p => isExcluded(p, member.id))) return { s: 'NP', auto: true, why: 'prod' };
  return null;
}
const hasData = (s, sec) => { const d = attDoc(s.id, sec); return !!(d && d.marks && Object.keys(d.marks).length); };
function progress(session, sec) {
  const ms = membersOf(sec);
  let done = 0;
  for (const m of ms) if (effMark(session, m)) done++;
  return { done, total: ms.length };
}
const nowHHMM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function defaultSession(list) {
  if (!list.length) return null;
  const todays = list.filter(s => s.date === TODAY);
  if (todays.length) {
    const d = new Date(), soon = `${pad(d.getHours() + 1)}:${pad(d.getMinutes())}`;
    return todays.filter(s => (s.time || '00:00') <= soon).pop() || todays[0];
  }
  const past = list.filter(s => s.date < TODAY);
  return past.length ? past[past.length - 1] : list[0];
}
/** Past sessions (or today's, once finished) where this corda still has people without a mark. */
function pendingSessions(sec) {
  const hhmm = nowHHMM();
  return allSessions().filter(s => convoked(s, sec)
    && (s.date < TODAY || (s.date === TODAY && (s.end || s.time || '23:59') <= hhmm))
    && (() => { const pr = progress(s, sec); return pr.done < pr.total; })());
}
/** Minutes late if someone arrives right now (only for today's session, once started). */
function lateNow(session) {
  if (!session || session.date !== TODAY || !session.time) return 0;
  const [h, m] = session.time.split(':').map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  const mins = Math.floor((Date.now() - start) / 60000);

function computeStats(scope, secFilter) {
  const base = scope.kind === 'prod' ? allSessions(scope.id) : allSessions().filter(s => s.date >= scope.from && s.date <= scope.to);
  const sessions = base.filter(s => s.date <= TODAY);
  const ctx = scope.kind === 'prod' ? scope.id : null;
  const members = [...S.members.values()].filter(m => !secFilter || m.section === secFilter);
  const per = new Map(members.map(m => [m.id, { m, ...emptyCounts(), hist: [], notes: [] }]));
  const tot = emptyCounts();
  const bySec = Object.fromEntries(SECTIONS.map(s => [s.id, emptyCounts()]));
  const bySession = [];
  for (const s of sessions) {
    const c = emptyCounts();
    let any = false;
    for (const m of members) {
      if (!convoked(s, m.section)) continue;
      const mk = hasData(s, m.section) ? effMark(s, m, ctx) : null;
      const rec = per.get(m.id);
      rec.hist.push({ s, mk });
      if (!mk) continue;
      any = true;
      c[mk.s]++; tot[mk.s]++; rec[mk.s]++; bySec[m.section][mk.s]++;
      if (mk.s === 'R') { const mn = +mk.min || 0; c.min += mn; tot.min += mn; rec.min += mn; bySec[m.section].min += mn; }
      if (mk.note) rec.notes.push({ s, mk });

/* ---------- Norma: assistència mínima per fer el concert ---------- */
const RULE_SKIP = new Set(['Concert', 'Altres']);
const minAttendance = () => Math.min(100, Math.max(1, +S.config.minAttendance || 80));
/** status: ok | risk (below now, can still reach it) | out (cannot reach it any more) | null (no data / not in it) */
function ruleStatus(prodId, member) {
  if (!prodId || isExcluded(prodId, member.id)) return null;
  const min = minAttendance() / 100;
  let att = 0, abs = 0, remaining = 0;
  for (const s of allSessions(prodId)) {
    if (RULE_SKIP.has(s.type) || !convoked(s, member.section)) continue;
    const marked = s.date <= TODAY && hasData(s, member.section) ? effMark(s, member, prodId) : null;
    if (!marked) { if (s.date >= TODAY && !onLeave(member, s.date)) remaining++; continue; }
    if (marked.s === 'NP') continue;
    if (marked.s === 'P' || marked.s === 'R') att++; else abs++;
  }
  const done = att + abs;
  if (!done) return null;
  const cur = att / done, best = (att + remaining) / (done + remaining);
  return { cur, best, att, abs, remaining, status: best < min ? 'out' : cur < min ? 'risk' : 'ok' };
}

}

function rsvpCounts(session) {

    const c = out.bySec[x.id] = { yes: 0, no: 0, none: 0 };
    for (const m of membersOf(x.id)) {
      if (isOut(session, m)) continue;
      const a = S.rsvp.get(`${session.id}_${m.id}`)?.answer;

}

  ${canMark(cur, sec) ? '<p class="muted" style="font-size:12.5px;text-align:center;margin-top:12px">Toca l’estat marcat una altra vegada per desmarcar-lo.</p>' : ''}`;
}
function subLine(cur, sec, leader) {

function countsFor(session, members) {

function rsvpPill(session, m) {

/* ---------- View: Calendar ---------- */
function viewCalendar() {
  const prods = productionsSorted();
  if (ui.calProd !== 'all' && !S.productions.has(ui.calProd)) ui.calProd = 'all';
  const chips = `<div class="chips" role="group" aria-label="Filtra per producció">
    <button class="chip" aria-pressed="${ui.calProd === 'all'}" data-act="cal-prod" data-id="all">Totes</button>
    ${prods.map(p => `<button class="chip" aria-pressed="${ui.calProd === p.id}" data-act="cal-prod" data-id="${p.id}"><i class="pdot prod-tone" style="--ph:${prodHue(p)}"></i>${esc(p.name)}</button>`).join('')}
  </div>`;
  const head = `<div class="page-head"><h1 class="h1">Calendari</h1>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" data-act="cal-subscribe">Subscriu-t’hi</button><button class="btn btn-sm" data-act="cal-past">${ui.calPast ? 'Amaga passades' : 'Mostra passades'}</button>
    ${canEdit() ? '<button class="btn btn-sm btn-primary" data-act="session-new">+ Sessió</button>' : ''}</span></div>
    ${S.role === 'singer' ? '<p class="muted" style="margin:-6px 2px 12px;font-size:13px">Toca una sessió per avisar que no hi podràs anar.</p>' : ''}`;
  if (!prods.length) return head + `<div class="empty">${staffSvg()}<h2 class="h2">Cap producció</h2><p>Les sessions s’organitzen per produccions.</p>${canEdit() ? '<button class="btn btn-primary" data-act="prod-new">Nova producció</button>' : ''}</div>`;

  const shown = ui.calProd === 'all' ? prods : prods.filter(p => p.id === ui.calProd);
  let body = '';
  let hiddenPast = 0;
  for (const p of shown) {
    // In «Totes», a shared session appears once, under its own production.
    let sessions = allSessions(p.id).filter(s => ui.calProd !== 'all' || s.prodId === p.id);
    const total = sessions.length;
    if (!ui.calPast) { const before = sessions.length; sessions = sessions.filter(s => s.date >= TODAY); hiddenPast += before - sessions.length; }
    if (ui.calProd === 'all' && !sessions.length) continue;
    let rows = '', month = '';
    for (const s of sessions) {
      const m = s.date.slice(0, 7);
      if (m !== month) { if (rows) rows += '</ul>'; month = m; rows += `<div class="cal-month">${monthYear(s.date)}</div><ul class="cal-list">`; }
      rows += calRow(s, p.id);
    }
    if (rows) rows += '</ul>';
    body += `<section class="cal-prod prod-tone" style="--ph:${prodHue(p)}">
      <div class="cal-prod-h"><h2 class="h2"><i class="pdot"></i>${esc(p.name)}</h2><span class="mono muted" style="font-size:12px;white-space:nowrap">${total} sessions</span></div>
      ${rows || `<p class="muted">No queden sessions pendents. ${ui.calPast ? '' : 'Mostra les passades per veure-les.'}</p>`}
    </section>`;
  }
  if (!body) body = `<div class="empty"><p>No hi ha sessions properes${hiddenPast ? ` (${hiddenPast} ja passades)` : ''}.</p><button class="btn" data-act="cal-past">Mostra passades</button></div>`;
  return head + chips + body;
}
function calRow(s, underProd) {
  const staff = S.role !== 'singer';
  let right = '';
