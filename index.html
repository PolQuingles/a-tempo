<link rel="manifest" href="app.webmanifest" id="ln-manifest">
<script>
// Abans de pintar: tema triat i, si ja se sap de quina agrupació és qui entra, la seva icona i el seu nom.
(function(){try{
  // L'app es deia «cor-present»: el que hi havia desat al mòbil es copia a les claus noves.
  if(!localStorage.getItem('atempo:migrat')){
    var ks=[];for(var i=0;i<localStorage.length;i++){var kk=localStorage.key(i);if(kk&&kk.indexOf('corpresent:')===0)ks.push(kk);}
    for(var j=0;j<ks.length;j++){var nk='atempo:'+ks[j].slice(11);if(localStorage.getItem(nk)==null)localStorage.setItem(nk,localStorage.getItem(ks[j]));}
    localStorage.setItem('atempo:migrat','1');
  }
  var t=localStorage.getItem('atempo:tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
  var tx=localStorage.getItem('atempo:text');if(tx==='gran'||tx==='molt')document.documentElement.setAttribute('data-text',tx);
  var m=location.search.match(/[?&]a=([A-Za-z0-9_-]{20,40})/),g=m?m[1]:localStorage.getItem('atempo:agrupacio');
  if(g&&/^[A-Za-z0-9_-]{20,40}$/.test(g)&&localStorage.getItem('atempo:marca-ok:'+g)){
    var b='marca/'+g+'/',d=document;
    d.getElementById('ln-icon').href=b+'favicon-48.png';d.getElementById('ln-touch').href=b+'icon-180.png';d.getElementById('ln-manifest').href=b+'manifest.webmanifest';
    var k=JSON.parse(localStorage.getItem('atempo:marca:'+g)||'null');
    if(k){if(k.short||k.name)d.querySelector('meta[name="apple-mobile-web-app-title"]').content=k.short||k.name;if(k.bg)d.querySelector('meta[name="theme-color"]').content=k.bg;}
  }
}catch(e){}})();
</script>
