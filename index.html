    body += `<section class="cal-prod prod-tone" style="--ph:${prodHue(p)}">
      <div class="cal-prod-h"><h2 class="h2"><i class="pdot"></i>${esc(p.name)}</h2><span class="mono muted" style="font-size:12px;white-space:nowrap">${total} sessions</span></div>
      ${rows || `<p class="muted">No queden sessions pendents. ${ui.calPast ? '' : 'Mostra les passades per veure-les.'}</p>`}
    </section>`;
  }
  if (!body) body = `<div class="empty"><p>No hi ha sessions properes${hiddenPast ? ` (${hiddenPast} ja passades)` : ''}.</p><button class="btn" data-act="cal-past">Mostra passades</button></div>`;
  return head + chips + body;
}
/** Month grid: one cell per day with a coloured mark per session; the chosen day is listed below. */
function calMonthView() {
  const list = ui.calProd === 'all' ? allSessions() : allSessions(ui.calProd);
  const thisMonth = TODAY.slice(0, 7);
  if (!/^\d{4}-\d{2}$/.test(ui.calMonth || '')) {
    const upcoming = list.find(x => x.date >= TODAY);
    ui.calMonth = list.some(x => x.date.slice(0, 7) === thisMonth) || !upcoming ? thisMonth : upcoming.date.slice(0, 7);
  }
  const [y, mo] = ui.calMonth.split('-').map(Number);
  const lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const days = new Date(y, mo, 0).getDate();
  const inMonth = list.filter(x => x.date.slice(0, 7) === ui.calMonth);
  const byDay = new Map();
  for (const x of inMonth) { if (!byDay.has(x.date)) byDay.set(x.date, []); byDay.get(x.date).push(x); }
  if (!ui.calDay || ui.calDay.slice(0, 7) !== ui.calMonth) ui.calDay = ui.calMonth === thisMonth ? TODAY : (inMonth[0]?.date || `${ui.calMonth}-01`);
  const cells = Array.from({ length: lead }, () => '<span class="mday out" aria-hidden="true"></span>');
  for (let d = 1; d <= days; d++) {
    const iso = `${ui.calMonth}-${pad(d)}`;
    const ss = byDay.get(iso) || [];
    const marks = ss.slice(0, 3).map(x => `<i class="mk prod-tone${isShow(x) ? ' concert' : ''}" style="--ph:${prodHue(S.productions.get(x.prodId))}"></i>`).join('') + (ss.length > 3 ? '<i class="mk more">+</i>' : '');
    const label = `${longDate(iso)}${ss.length ? `: ${ss.map(x => x.type || 'Assaig').join(', ')}` : ', cap sessió'}`;
    cells.push(`<button class="mday${iso === TODAY ? ' today' : ''}${iso === ui.calDay ? ' sel' : ''}${iso < TODAY ? ' past' : ''}" data-act="cal-day" data-date="${iso}" aria-pressed="${iso === ui.calDay}" aria-label="${esc(label)}"><span class="mnum">${d}</span><span class="mmarks">${marks}</span></button>`);
  }
  while (cells.length % 7) cells.push('<span class="mday out" aria-hidden="true"></span>');
  const title = capz(fmtD(`${ui.calMonth}-01`, { month: 'long', year: 'numeric' }));
  const legendProds = [...new Set(inMonth.map(x => x.prodId))].map(id => S.productions.get(id)).filter(Boolean);
  const hasConcert = inMonth.some(isShow);
  const daySessions = byDay.get(ui.calDay) || [];
  return `<div class="panel month">
      <div class="mnav"><button class="nav-arrow" data-act="cal-month" data-dir="-1" aria-label="Mes anterior">${ICON.left}</button><h2 class="h2">${esc(title)}</h2><button class="nav-arrow" data-act="cal-month" data-dir="1" aria-label="Mes següent">${ICON.right}</button></div>
      <div class="mweek" aria-hidden="true">${['dl', 'dt', 'dc', 'dj', 'dv', 'ds', 'dg'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="mgrid">${cells.join('')}</div>
      ${legendProds.length ? `<div class="mlegend">${legendProds.map(p => `<span class="prod-tone" style="--ph:${prodHue(p)}"><i class="pdot"></i>${esc(p.name)}</span>`).join('')}${hasConcert ? `<span><i class="mk concert key"></i>${V.sh.Show}</span>` : ''}</div>` : '<p class="muted" style="margin:10px 4px 0;font-size:13px">Aquest mes no hi ha cap sessió.</p>'}
    </div>
    <div class="section-title" style="margin-top:18px"><h2 class="h2">${esc(longDate(ui.calDay))}</h2>${ui.calDay !== TODAY ? '<button class="btn btn-sm btn-ghost" data-act="cal-today">Avui</button>' : ''}</div>
    ${daySessions.length ? `<ul class="cal-list cal-day-list">${daySessions.map(x => calRow(x, x.prodId, true)).join('')}</ul>`
      : `<div class="panel" style="padding:14px;font-size:13.5px;color:var(--muted)">Cap sessió aquest dia.</div>`}`;
}
function calRow(s, underProd, tone) {
  const staff = !isLinkOnly();
  let right = '';
  if (staff) {
    let marks;
    if (SECTIONS.length <= 5) {
      marks = SECTIONS.map(x => {
        if (!convoked(s, x.id)) return `<span class="vm off${x.short.length > 1 ? ' long' : ''}" title="${esc(x.name)}: no convocats">${esc(x.short)}</span>`;
        const pr = progress(s, x.id);
        const cls = !hasData(s, x.id) ? '' : pr.total && pr.done === pr.total ? 'full' : 'part';
        return `<span class="vm ${cls}${x.short.length > 1 ? ' long' : ''}" title="${esc(x.name)}: ${pr.done}/${pr.total}">${esc(x.short)}</span>`;
      }).join('');
    } else {
      // Moltes seccions: un sol comptador de llistes completes.
      const on = SECTIONS.filter(x => convoked(s, x.id));
      const full = on.filter(x => { const pr = progress(s, x.id); return pr.total && pr.done === pr.total; }).length;
      const any = on.some(x => hasData(s, x.id));
      marks = `<span class="vm-sum ${!any ? '' : full === on.length ? 'full' : 'part'}" title="Llistes completes">${full}/${on.length}</span>`;
    }
    const c = emptyCounts();
    for (const x of SECTIONS) if (convoked(s, x.id) && hasData(s, x.id)) for (const m of membersOf(x.id)) { const mk = effMark(s, m); if (mk) c[mk.s]++; }
    const r = rate(c);
    const rv = s.rsvp && canEdit() ? rsvpCounts(s) : null;
    right = `<span class="cal-right"><span class="vmarks" aria-label="Llista per ${V.sections}">${marks}</span>${r != null ? `<span class="cal-pct">${pct(r)}</span>` : rv ? `<span class="cal-badge" title="Confirmacions">${rv.yes}✓ ${rv.no}✗ ${rv.none}?</span>` : ''}</span>`;
  } else {
    const me = S.members.get(myMemberId());
    const mine = me && [...S.absences.values()].find(a => a.memberId === me.id && (a.sessionIds || []).includes(s.id) && a.status !== 'rejected');
    const rv = me && s.rsvp && S.rsvp.get(`${s.id}_${me.id}`);
    right = mine ? `<span class="cal-right"><span class="st-pill st-${mine.status}">${mine.kind === 'late' ? 'Tard' : 'No hi vaig'}</span></span>`
      : rv ? `<span class="cal-right"><span class="rsvp ${rv.answer}">${rv.answer === 'yes' ? 'Hi seré' : 'No hi seré'}</span></span>`
      : s.rsvp && s.date >= TODAY ? '<span class="cal-right"><span class="rsvp none">Confirma</span></span>' : '<span></span>';
  }
  const other = sessionProds(s).filter(id => id !== underProd).map(id => S.productions.get(id)?.name).filter(Boolean);
  const cls = [s.date === TODAY ? 'is-today' : '', s.date < TODAY ? 'is-past' : '', isShow(s) ? 'type-concert' : ''].join(' ');
  const openAct = staff ? 'open-session' : (s.date >= TODAY ? 'absence-new' : '');
  return `<li class="cal-row ${cls}${tone ? ' prod-tone' : ''}" data-date="${s.date}"${tone ? ` style="--ph:${prodHue(S.productions.get(s.prodId))}"` : ''}>
    <button class="cal-main" ${openAct ? `data-act="${openAct}"` : 'disabled'} data-sid="${s.id}">
      <span class="cal-date"><b>${+s.date.slice(8, 10)}</b><small>${wdShort(s.date)}</small></span>
      <span class="cal-info"><span class="cal-type">${esc(s.type || 'Assaig')}</span><span class="cal-place">${[s.info?.call ? `Convocatòria <span class="mono">${esc(s.info.call)}</span>` : '', s.time ? `<span class="mono">${esc(timeRange(s))}</span>` : '', esc(s.place || ''), esc(s.note || ''), other.length ? `També: ${esc(other.join(', '))}` : ''].filter(Boolean).join(' · ')}</span></span>
      ${right}
    </button>
    ${hasInfo(s) ? `<button class="icon-btn info" data-act="session-info" data-sid="${s.id}" aria-label="Fitxa de la sessió">${ICON.info}</button>` : ''}
    ${canEdit() ? `<button class="icon-btn" data-act="session-edit" data-sid="${s.id}" aria-label="Edita la sessió">${ICON.more}</button>` : ''}
  </li>`;
}

/* ---------- View: Stats ---------- */
function viewStats() {
  const prods = productionsSorted();
  if (!prods.length) return `<div class="page-head"><h1 class="h1">Estadístiques</h1></div><div class="empty">${staffSvg()}<p>Quan hi hagi produccions amb llistes passades, veuràs aquí l’assistència.</p></div>`;
  const scopeTabs = `<div class="subtabs" role="tablist" style="margin-bottom:10px;grid-template-columns:repeat(4,1fr)">${[['prod', 'Producció'], ['term', 'Trimestre'], ['season', 'Temporada'], ['risk', 'Risc']].map(([k, l]) => `<button class="subtab" role="tab" aria-selected="${ui.statsScope === k}" data-act="stats-scope" data-k="${k}" style="font-size:12.5px">${l}</button>`).join('')}</div>`;
  if (ui.statsScope === 'risk') return `<div class="page-head"><div><div class="eyebrow">Estadístiques</div><h1 class="h1">Norma del ${minAttendance()}%</h1></div></div>` + scopeTabs + riskView();
  const scope = currentScope();
  const { terms } = seasonCfg();
  const st = computeStats(scope, ui.statsSec);
  const choice = ui.statsScope === 'prod'
    ? `<div class="chips" role="group" aria-label="Producció">${prods.map(p => `<button class="chip" aria-pressed="${p.id === scope.id}" data-act="stats-prod" data-id="${p.id}"><i class="pdot prod-tone" style="--ph:${prodHue(p)}"></i>${esc(p.name)}</button>`).join('')}</div>`
    : ui.statsScope === 'term'
      ? `<div class="chips" role="group" aria-label="Trimestre">${terms.map((t, i) => `<button class="chip" aria-pressed="${i === ui.statsTerm}" data-act="stats-term" data-i="${i}">${esc(t.name)}</button>`).join('')}</div>`
      : '';
  const secChips = `<div class="chips" role="group" aria-label="${V.Section}" style="padding-bottom:4px">
    <button class="chip" aria-pressed="${!ui.statsSec}" data-act="stats-sec" data-sec="">${capz(V.tot)}</button>
    ${SECTIONS.map(x => `<button class="chip" aria-pressed="${ui.statsSec === x.id}" data-act="stats-sec" data-sec="${x.id}">${esc(x.name)}</button>`).join('')}</div>`;
  const sub = scope.kind === 'range' ? `<p class="muted mono" style="margin:4px 0 0;font-size:12.5px">${ddmm(scope.from)}/${scope.from.slice(0, 4)} – ${ddmm(scope.to)}/${scope.to.slice(0, 4)}</p>` : '';
  const tone = scope.kind === 'prod' ? ` prod-tone tinted" style="--ph:${prodHue(S.productions.get(scope.id))}` : '';
  const head = `<div class="page-head${tone}"><div><div class="eyebrow">${scope.kind === 'prod' ? '<i class="pdot"></i>Producció' : 'Estadístiques'}</div><h1 class="h1">${esc(scope.name)}</h1>${sub}</div>
    <button class="btn btn-sm" data-act="export-csv">Exporta CSV</button></div>`;
  const top = head + scopeTabs + choice + secChips;

  if (!st.counted.length) {
    const first = st.all[0];
    return top + `<div class="empty"><p>Encara no s’ha passat llista en cap sessió d’aquest període${st.all.length ? ` (${st.all.length} sessions programades, la primera el ${shortDate(first.date)})` : ''}.</p></div>`;
  }
  const t = st.tot;
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="kpi-v">${kpiPct(rate(t))}</div><div class="kpi-l">Assistència</div></div>
    <div class="kpi"><div class="kpi-v">${kpiPct(punctuality(t))}</div><div class="kpi-l">Puntualitat</div></div>
    <div class="kpi"><div class="kpi-v">${t.min}<small>min</small></div><div class="kpi-l">Retard acumulat · ${t.R} retards</div></div>
    <div class="kpi ${t.FNJ ? 'alert' : ''}"><div class="kpi-v">${t.FNJ}</div><div class="kpi-l">Faltes no justificades · ${t.FJ} just.</div></div>
  </div>
  <p class="muted" style="font-size:12.5px;margin:10px 2px 0">${st.counted.length} de ${st.all.length} sessions amb llista · Assistència = presents i retards sobre convocats (sense comptar «no fa» ni baixes).</p>`;

  const dist = `<div class="panel" style="padding:14px;margin-top:14px">${stackBar(t)}<div class="legend">${ORDER.map(k => `<span><i class="i-${k}"></i>${STATUS[k].label} <b>${t[k]}</b></span>`).join('')}</div></div>`;

  // Norma del concert (only per production)
  let rule = '';
  const ruleMap = new Map();
  if (scope.kind === 'prod') {
    for (const r of st.rows) { const rs = ruleStatus(scope.id, r.m); if (rs) ruleMap.set(r.m.id, rs); }
    const outL = st.rows.filter(r => ruleMap.get(r.m.id)?.status === 'out');
    const riskL = st.rows.filter(r => ruleMap.get(r.m.id)?.status === 'risk');
    const hasConcert = st.all.some(isShow);
    const item = (r, rs) => `<li><span><b>${esc(r.m.name)}</b> <span class="muted">· ${esc(SEC[r.m.section].name)} · ${pct(rs.cur)}${rs.status === 'risk' ? ` (pot arribar al ${pct(rs.best)})` : ''}</span></span><button class="rule ${rs.status}" data-act="member-stats" data-mid="${r.m.id}">${rs.status === 'out' ? `No pot fer ${V.sh.el}` : 'En risc'}</button></li>`;
    rule = `<div class="section-title"><h2 class="h2">Norma del ${minAttendance()}%</h2>${hasConcert ? `<button class="btn btn-sm" data-act="concert-list" data-pid="${scope.id}">${V.sh.list}</button>` : '<span class="eyebrow">assistència mínima</span>'}</div>
      <div class="panel">
        ${outL.length || riskL.length ? `<ul class="alerts">${outL.map(r => item(r, ruleMap.get(r.m.id))).join('')}${riskL.map(r => item(r, ruleMap.get(r.m.id))).join('')}</ul>`
          : `<p style="margin:0;padding:14px;font-size:13.5px">Ara mateix tothom compleix la norma.</p>`}
        <p class="muted" style="margin:0;padding:10px 14px 12px;font-size:12px;border-top:1px solid var(--line)">Compten tots els assajos de la producció (no ${V.sh.els} ni les sessions «Altres»). «En risc» vol dir que ara està per sota però encara hi pot arribar amb els assajos que queden.</p>
      </div>`;
  }

  const secBars = !ui.statsSec ? `<div class="section-title"><h2 class="h2">Per ${V.sections}</h2><span class="eyebrow">assistència</span></div>
    <div class="panel bars">${SECTIONS.map(x => {
      const c = st.bySec[x.id]; const r = rate(c);
      return `<div class="bar-row"><span class="lbl" title="${esc(x.name)}"><em>${esc(x.short)}</em><span>${esc(x.name)}</span></span>${stackBar(c)}<span class="val">${pct(r)}</span></div>`;
    }).join('')}</div>` : '';

  const cols = st.counted.map(({ s, c }) => {
    const d = c.P + c.R + c.FJ + c.FNJ;
    const seg = k => d ? `<span class="s-${k}" style="height:${(c[k] / d) * 100}%;background:var(--${k.toLowerCase()})"></span>` : '';
    return `<button class="tcol" data-act="open-session" data-sid="${s.id}" title="${shortDate(s.date)} · ${s.type || 'Assaig'} · ${pct(rate(c))}" aria-label="${longDate(s.date)}: ${pct(rate(c))}">
      <span class="tbar" style="height:100%">${['P', 'R', 'FJ', 'FNJ'].map(seg).join('')}</span></button>`;
  }).join('');
  const every = Math.max(1, Math.ceil(st.counted.length / 8));
  const labels = st.counted.map(({ s }, i) => `<span>${i % every === 0 ? ddmm(s.date) : ''}</span>`).join('');
  const minW = st.counted.length * 22 + 34;
  const trend = `<div class="section-title"><h2 class="h2">Sessió a sessió</h2><span class="eyebrow">toca per obrir</span></div>
    <div class="panel"><div class="trend-wrap"><div style="min-width:${minW}px">
      <div class="trend">${[100, 75, 50, 25].map(v => `<div class="grid" style="bottom:${v}%"><span>${v}%</span></div>`).join('')}${cols}</div>
      <div class="tlabels">${labels}</div></div></div>
      <div class="trend-note legend" style="margin:0;padding:0 14px 12px">${['P', 'R', 'FJ', 'FNJ'].map(k => `<span><i class="i-${k}"></i>${STATUS[k].short}</span>`).join('')}</div></div>`;

  const fnjAlert = st.rows.filter(r => r.FNJ >= (+S.config.alertFNJ || 3)).sort((a, b) => b.FNJ - a.FNJ);
  const alerts = fnjAlert.length ? `<div class="section-title"><h2 class="h2">Cal fer seguiment</h2><span class="eyebrow">≥ ${S.config.alertFNJ || 3} faltes no just.</span></div>
    <div class="panel"><ul class="alerts">${fnjAlert.map(r => `<li><span><b>${esc(r.m.name)}</b> <span class="muted">· ${esc(SEC[r.m.section].name)}</span></span><button class="pill fnj" data-act="member-stats" data-mid="${r.m.id}">${r.FNJ} FNJ</button></li>`).join('')}</ul></div>` : '';

  const sorters = { pct: 'Assistència', name: 'Nom', late: 'Retards' };
  const rows = [...st.rows].sort((a, b) => {
    if (ui.statsSort === 'name') return byName(a.m, b.m);
    if (ui.statsSort === 'late') return b.min - a.min || b.R - a.R;
    const ra = rate(a), rb = rate(b);
    return (ra ?? 2) - (rb ?? 2) || byName(a.m, b.m);
  });
  const table = `<div class="section-title"><h2 class="h2">${V.Members}</h2>
      <div class="sortbar">${Object.entries(sorters).map(([k, l]) => `<button class="chip" style="min-height:30px;font-size:12.5px" aria-pressed="${ui.statsSort === k}" data-act="stats-sort" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div id="stlist">${findBox('#stlist', `Cerca un ${V.member}`)}<div class="panel"><ul class="mtable">${rows.map(r => {
      const counted = r.P + r.R + r.FJ + r.FNJ;
      const rs = ruleMap.get(r.m.id);
      return `<li class="mrow" data-find="${esc(normText(r.m.name))}"><button data-act="member-stats" data-mid="${r.m.id}">
        <span class="mname"><em>${esc(secShort(r.m.section))}</em><span>${esc(r.m.name)}</span>${rs && rs.status !== 'ok' ? `<span class="rule ${rs.status}">${rs.status === 'out' ? `&lt;${minAttendance()}%` : 'En risc'}</span>` : ''}</span>
        <span class="mpct">${counted ? pct(rate(r)) : (r.NP ? 'No fa' : '—')}</span>
        ${stackBar(r)}
        <span class="mcounts">
          <span><i class="i-P"></i><b>${r.P}</b></span>
          <span><i class="i-R"></i><b>${r.R}</b>${r.min ? ` · ${r.min}′` : ''}</span>
          <span><i class="i-FNJ"></i><b>${r.FNJ}</b></span>
          <span><i class="i-FJ"></i><b>${r.FJ}</b></span>
          ${r.NP ? `<span><i class="i-NP"></i><b>${r.NP}</b></span>` : ''}
        </span></button></li>`;
    }).join('')}</ul></div><div class="panel find-empty" hidden>Ningú amb aquest nom.</div></div>`;

  return top + kpis + rule + dist + secBars + trend + alerts + table;
}

/* ---------- Risc: qui no arriba a la norma ---------- */
function riskProductions() {
  const cur = currentProductionId();
  return productionsSorted().filter(p => p.id === cur || allSessions(p.id).some(s => s.date >= TODAY));
}
/** How many of the remaining rehearsals they must attend to reach the minimum. */
function needed(rs) {
  const min = minAttendance() / 100;
  const total = rs.att + rs.abs + rs.remaining;
  return Math.max(0, Math.ceil(min * total - rs.att - 1e-9));
}
function riskLine(rs) {
  if (rs.status === 'out') return `No hi arriba: encara que vingui a tot, es queda al ${pct(rs.best)}.`;
  const n = needed(rs);
  return `Ha de venir a ${n === rs.remaining ? `tots els ${n}` : `${n} dels ${rs.remaining}`} assajos que queden.`;
}
function riskView() {
  const prods = riskProductions();
  if (!prods.length) return `<div class="empty">${staffSvg()}<p>No hi ha cap producció en curs ni cap de propera.</p></div>`;
  let nOut = 0, nRisk = 0;
  const blocks = prods.map(pr => {
    const rows = [];
    for (const x of SECTIONS) for (const m of membersOf(x.id)) {
      const rs = ruleStatus(pr.id, m);
      if (!rs || rs.status === 'ok') continue;
      rows.push({ m, rs });
    }
    rows.sort((a, b) => (a.rs.status === b.rs.status ? 0 : a.rs.status === 'out' ? -1 : 1) || a.rs.cur - b.rs.cur || byName(a.m, b.m));
    nOut += rows.filter(r => r.rs.status === 'out').length;
    nRisk += rows.filter(r => r.rs.status === 'risk').length;
    const hasConcert = allSessions(pr.id).some(isShow);
    return `<div class="section-title prod-tone" style="--ph:${prodHue(pr)}"><h2 class="h2"><i class="pdot"></i>${esc(pr.name)}</h2>
        ${hasConcert ? `<button class="btn btn-sm" data-act="concert-list" data-pid="${pr.id}">${V.sh.list}</button>` : ''}</div>
      <div class="panel prod-tone tinted" style="--ph:${prodHue(pr)}">${rows.length ? rows.map(({ m, rs }) => `<button class="risk-row" data-act="member-stats" data-mid="${m.id}">
          <span class="rn">${esc(m.name)}</span><span class="rule ${rs.status}">${rs.status === 'out' ? `${pct(rs.cur)} · no hi arriba` : `${pct(rs.cur)} · en risc`}</span>
          <span class="rm">${esc(SEC[m.section].name)} · ${rs.att} de ${rs.att + rs.abs} assajos · ${riskLine(rs)}</span></button>`).join('')
        : '<p style="margin:0;padding:14px;font-size:13.5px">Tothom compleix la norma.</p>'}</div>`;
  }).join('');
  const text = () => {
    const out = [`Seguiment de la norma del ${minAttendance()}%`];
    for (const pr of prods) {
      const rows = [];
      for (const x of SECTIONS) for (const m of membersOf(x.id)) {
        const rs = ruleStatus(pr.id, m);
        if (rs && rs.status !== 'ok') rows.push(`  ${m.name} (${SEC[m.section].name}): ${pct(rs.cur)} — ${riskLine(rs)}`);
      }
      out.push('', pr.name, rows.length ? rows.join('\n') : '  Tothom compleix la norma.');
    }
    return out.join('\n');
  };
  window.__riskText = text;
  return `<div class="kpis" style="grid-template-columns:repeat(2,1fr)">
      <div class="kpi ${nOut ? 'alert' : ''}"><div class="kpi-v">${nOut}</div><div class="kpi-l">No poden fer ${V.sh.el}</div></div>
      <div class="kpi"><div class="kpi-v">${nRisk}</div><div class="kpi-l">Hi són a temps</div></div>
    </div>
    <p class="muted" style="font-size:12.5px;margin:10px 2px 0">Produccions en curs i properes. Compten els assajos (no ${V.sh.els} ni les sessions «Altres») i no compten les baixes.</p>
    ${blocks}
    <div class="panel" style="padding:14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:13.5px">Passa-ho a direcció o guarda-ho.</span>
      <button class="btn btn-sm" data-act="risk-copy">Copia el resum</button></div>`;
}

/* ---------- Llista de concert ---------- */
const concertDates = pid => allSessions(pid).filter(isShow).map(s => s.date).sort();
function concertRows(pid) {
  const prod = S.productions.get(pid);
  const dec = prod.concert || {};
  const dates = concertDates(pid);
  const first = dates[0] || null;
  const min = minAttendance() / 100;
  const rows = [];
  for (const x of SECTIONS) for (const m of membersOf(x.id)) {
    if (isExcluded(pid, m.id)) continue;
    const lv = first && onLeave(m, first);
    const rs = ruleStatus(pid, m);
    let base, note;
    if (lv) { base = 'baixa'; note = leaveText(m) || 'De baixa'; }
    else if (!rs) { base = 'sense'; note = 'Encara no hi ha cap llista passada'; }
    else if (rs.cur >= min) { base = 'apte'; note = `${pct(rs.cur)} · ${rs.att} de ${rs.att + rs.abs} assajos`; }
    else if (rs.status === 'risk') { base = 'pendent'; note = `${pct(rs.cur)} · ${riskLine(rs)}`; }
    else { base = 'no'; note = `${pct(rs.cur)} · ${riskLine(rs)}`; }
    const forced = dec.exclude && dec.exclude[m.id] !== undefined ? 'exclude'
      : dec.include && dec.include[m.id] !== undefined ? 'include' : null;
    const why = forced === 'include' ? dec.include[m.id] : forced === 'exclude' ? dec.exclude[m.id] : '';
    // Apte · pendent (per sota però encara hi pot arribar) · fora.
    const state = forced ? (forced === 'include' ? 'apte' : 'fora')
      : base === 'apte' || base === 'sense' ? 'apte'
      : base === 'pendent' ? 'pendent' : 'fora';
    rows.push({ m, base, note, forced, why, state, inList: state === 'apte' });
  }
  return { prod, dates, rows };
}
const stateLabel = k => ({ apte: `Hi pot ${V.play}`, pendent: 'Encara hi és a temps', fora: 'Fora de la llista' }[k]);
function sheetConcertDecide(pid, mid) {
  const { prod, rows } = concertRows(pid);
  const r = rows.find(z => z.m.id === mid);
  if (!r) return;
  const save = (kind, why) => {
    const dec = { include: { ...(prod.concert?.include || {}) }, exclude: { ...(prod.concert?.exclude || {}) },
      ...(prod.concert?.at ? { at: prod.concert.at, by: prod.concert.by } : {}) };
    delete dec.include[mid]; delete dec.exclude[mid];
    if (kind === 'include') dec.include[mid] = why;
    if (kind === 'exclude') dec.exclude[mid] = why;
    saveProduction({ ...prod, concert: dec });
    closeSheet(); sheetConcertList(pid);
  };
  openSheet({
    title: r.m.name,
    body: `<p style="margin-top:0"><b>${stateLabel(r.state)}</b><br><span class="muted" style="font-size:13.5px">${esc(r.note)}</span></p>
      ${r.forced ? `<p class="muted" style="font-size:13px">Ara està decidit a mà${r.why ? `: ${esc(r.why)}` : ''}.</p>` : ''}
      <label class="field"><span>Motiu (surt a la llista)</span><input class="inp" id="cd-why" type="text" maxlength="90" value="${esc(r.forced ? r.why : '')}" placeholder="p. ex. es va incorporar tard"></label>`,
    foot: `${r.forced ? '<button class="btn" id="cd-auto">Torna a l’automàtic</button>' : ''}<span class="spacer"></span>
      <button class="btn btn-danger-ghost" id="cd-no">No hi ${V.plays}</button><button class="btn btn-primary" id="cd-yes">Hi ${V.plays}</button>`,
    onMount: el => {
      const why = () => el.querySelector('#cd-why').value.trim();
      el.querySelector('#cd-yes').onclick = () => save('include', why());
      el.querySelector('#cd-no').onclick = () => save('exclude', why());
      el.querySelector('#cd-auto')?.addEventListener('click', () => save(null, ''));
    },
  });
}
/** Per section: how many can perform each part (1, 2, either), plus those still in time. */
function voiceBalance(rows) {
  const PART_KEYS = [['1', '1', 'v1'], ['2', '2', 'v2'], ['1 o 2', '1/2', 'v12'], ['', '?', 'v0']];
  return SECTIONS.map(x => {
    const inSec = rows.filter(r => r.m.section === x.id);
    const apt = inSec.filter(r => r.state === 'apte'), wait = inSec.filter(r => r.state === 'pendent');
    const parts = PART_KEYS.map(([k, l, cls]) => ({
      k, label: k ? `${x.short}${l}` : `Sense ${V.part}`, cls,
      n: apt.filter(r => (r.m.part || '') === k).length,
      w: wait.filter(r => (r.m.part || '') === k).length,
    })).filter(pt => pt.k === '1' || pt.k === '2' || pt.n || pt.w);
    const n1 = parts.find(pt => pt.k === '1').n, n2 = parts.find(pt => pt.k === '2').n;
    const gap = Math.abs(n1 - n2) >= 3 ? `+${Math.abs(n1 - n2)} ${x.short}${n1 > n2 ? '1' : '2'}` : '';
    return { x, total: apt.length, wait: wait.length, parts, gap };
  });
}

      <p>Si en vols conservar alguna cosa, abans descarrega’n una còpia a Ajustos › Dades.</p>
      <label class="field"><span>Per confirmar-ho, escriu el nom de l’agrupació</span><input class="inp" id="dg-name" autocomplete="off" placeholder="${esc(name)}"></label>
      <p class="muted" id="dg-status" style="font-size:13px;margin:10px 0 0" aria-live="polite"></p>`,
    foot: `<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-danger" id="dg-go" disabled>Esborra-ho tot</button>`,
    onMount: el => {
      const input = el.querySelector('#dg-name'), go = el.querySelector('#dg-go');
      const norm = t => normText(t).replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
      input.oninput = () => { go.disabled = !name || norm(input.value) !== norm(name); };
      go.onclick = () => deleteGroup(el);
    },
  });
}
async function deleteGroup(el) {
  const say = t => { const p = el.querySelector('#dg-status'); if (p) p.textContent = t; };
  el.querySelector('#dg-go').disabled = true;
  el.querySelector('#dg-name').disabled = true;
  flushAll();
  const at = new Date().toISOString();
  try {
    const refs = [];
    for (const col of ['members', 'productions', 'attendance', 'absences', 'subs', 'rsvp', 'announcements', 'polls', 'pollVotes', 'memberMarks', 'push', 'config']) {
      say('Preparant…');
      const snap = await db.collection(col).get();
      for (const d of snap.docs) if (!(col === 'config' && d.id === 'main')) refs.push(d.ref);
    }
    for (const k of Object.values(S.secrets || {})) if (typeof k === 'string' && SECRET_RE.test(k)) refs.push(fs.doc(`claus/${k}`));
    refs.push(db.doc('secrets/main'), db.doc('secrets/members'));
    for (const e of S.staff.keys()) if (e !== S.me.email) refs.push(fs.doc(`staffIndex/${e}/agrupacions/${GID}`), db.doc(`staff/${e}`));
    for (let i = 0; i < refs.length; i += 400) {
      const b = fs.batch();
      refs.slice(i, i + 400).forEach(r => b.delete(r));
      say(`Esborrant… ${Math.min(refs.length, i + 400)} de ${refs.length + 4}`);
      await b.commit();
    }
    // Al final, i en un sol lot: la fitxa del directori, la configuració i el propi accés.
    const b = fs.batch();
    b.set(db.doc('config/main'), { name: '', deleted: true, deletedAt: at });
    if (S.group && S.group.status) b.update(fs.doc(`agrupacions/${GID}`), { status: 'deleted', deletedAt: at });
    b.delete(fs.doc(`staffIndex/${S.me.email}/agrupacions/${GID}`));
    b.delete(db.doc(`staff/${S.me.email}`));
    await b.commit();
  } catch (e) {
    say('No s’ha pogut acabar d’esborrar. Comprova la connexió i torna-ho a provar.');
    el.querySelector('#dg-go').disabled = false; el.querySelector('#dg-name').disabled = false;
    return;
  }
  try { localStorage.removeItem(LS_GROUP); localStorage.removeItem(`${LS_LINK}:${GID}`); } catch {}
  S.groups = S.groups.filter(g => g.id !== GID); saveGroupsCache();
  location.replace(location.pathname);
}

/* ---------- Fitxers pujats des de l'ordinador (PDF, àudio, imatges…) ---------- */
// Cada fitxer es desa a trossos de 700 KB dins de cors/<agrupació>/config (config/fitxer_<id>_<n>).
// Aquesta col·lecció ja té els permisos que cal: tothom de l'agrupació la pot llegir i només l'equip
// hi escriu. L'app només s'hi subscriu al document «main», de manera que els trossos només es
// descarreguen quan algú obre el fitxer. Materials i documents en guarden la fitxa a «file».
const FILE_CHUNK = 700 * 1024;
const FILE_MAX = 20 * 1024 * 1024;
const chunkPath = (fid, i) => `config/fitxer_${fid}_${i}`;
const fmtSize = n => !n ? '0 MB' : n < 1024 ? `${n} B` : n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1048576).toFixed(1).replace('.', ',')} MB`;
function fileKind(f) {
  const t = f.type || '', ext = (f.name.split('.').pop() || '').toLowerCase();
  if (t === 'application/pdf' || ext === 'pdf') return 'PDF';
  if (t.startsWith('audio/') || ['mp3', 'm4a', 'wav', 'aac', 'ogg', 'flac'].includes(ext)) return 'Àudio';
  if (t.startsWith('image/')) return 'Imatge';
  if (t.startsWith('video/')) return 'Vídeo';
  return ext ? ext.toUpperCase() : 'Fitxer';
}
const titleFromFile = name => name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();
async function uploadFile(file, onProgress) {
  const id = uid('f');
  const bytes = new Uint8Array(await file.arrayBuffer());
  const n = Math.max(1, Math.ceil(bytes.length / FILE_CHUNK));
  for (let i = 0; i < n; i++) {
    const part = bytes.subarray(i * FILE_CHUNK, (i + 1) * FILE_CHUNK);
    await db.doc(chunkPath(id, i)).set({ d: firebase.firestore.Blob.fromUint8Array(part), i, of: n });
    onProgress?.(i + 1, n);
  }
  return { id, name: file.name, type: file.type || '', size: file.size, chunks: n, at: new Date().toISOString() };
}
function deleteFile(f) {
  if (!f || !f.id) return;
  const b = fs.batch();
  for (let i = 0; i < (f.chunks || 1); i++) b.delete(db.doc(chunkPath(f.id, i)));
  b.commit().catch(() => {});
  fileUrls.delete(f.id);
}
const fileUrls = new Map();
async function loadFile(f) {
  if (fileUrls.has(f.id)) return fileUrls.get(f.id);
  const snaps = await Promise.all(Array.from({ length: f.chunks || 1 }, (_, i) => db.doc(chunkPath(f.id, i)).get()));
  if (snaps.some(x => !x.exists)) throw new Error('incomplet');
  const blob = new Blob(snaps.map(x => x.data().d.toUint8Array()), { type: f.type || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  fileUrls.set(f.id, url);
  return url;
}
function sheetOpenFile(f, title) {
  const kind = fileKind(f);
  openSheet({
    title: title || f.name,
    body: `<div id="fo-body"><p class="muted" style="margin:0">Carregant el fitxer (${esc(kind)} · ${fmtSize(f.size)})…</p></div>`,
    onMount: async el => {
      const box = el.querySelector('#fo-body');
      try {
        const url = await loadFile(f);
        if (!box.isConnected) return;
        const media = kind === 'Àudio' ? `<audio controls preload="metadata" src="${url}" style="width:100%"></audio>`
          : kind === 'Imatge' ? `<img src="${url}" alt="" style="display:block;width:100%;border-radius:12px">` : '';
        box.innerHTML = `${media}
          <p class="muted" style="margin:${media ? '12px' : '0'} 0 14px;font-size:13px;overflow-wrap:anywhere">${esc(f.name)} · ${esc(kind)} · ${fmtSize(f.size)}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">Obre</a><a class="btn" href="${url}" download="${esc(f.name)}">Desa al dispositiu</a></div>`;
      } catch {
        if (box.isConnected) box.innerHTML = '<p style="margin:0">No s’ha pogut carregar el fitxer. Comprova la connexió i torna-ho a provar.</p>';
      }
    },
  });
}

function sourceFields(prefix, item) {

function bindSource(el, prefix, onPick) {
  let picked = null;
  const drop = el.querySelector(`#${prefix}-drop`), input = el.querySelector(`#${prefix}-file`);
  el.querySelectorAll(`#${prefix}-src .pick`).forEach(b => b.onclick = () => {
    el.querySelectorAll(`#${prefix}-src .pick`).forEach(x => x.setAttribute('aria-pressed', x === b));
    el.querySelector(`#${prefix}-file-f`).hidden = b.dataset.src !== 'file';
    el.querySelector(`#${prefix}-url-f`).hidden = b.dataset.src !== 'link';
  });
  const choose = file => {
    if (!file) return;
    if (file.size > FILE_MAX) { toast(`${file.name} passa de 20 MB. Redueix-lo o penja’n un enllaç.`); return; }
    if (groupFileBytes() + file.size > fileQuotaMB() * 1048576) { toast(`No hi cap: l’agrupació ja fa servir ${fmtSize(groupFileBytes())} dels ${fileQuotaMB()} MB. Esborra’n algun de vell o penja’n un enllaç.`); return; }
    picked = file;
    drop.querySelector('.dz-t').textContent = file.name;
    drop.querySelector('.dz-s').textContent = `${fileKind(file)} · ${fmtSize(file.size)} · a punt per pujar`;
    drop.classList.add('ready');
    onPick?.(file);
  };
  input.onchange = () => choose(input.files && input.files[0]);
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); choose(e.dataTransfer?.files?.[0]); });
  return {
    mode: () => el.querySelector(`#${prefix}-src .pick[aria-pressed="true"]`).dataset.src,
    picked: () => picked,
    url: () => el.querySelector(`#${prefix}-url`).value.trim(),
  };
}
/** Resolve the source on save: uploads when needed. Returns { url, file } or null if it could not. */
async function resolveSource(src, previous, btn) {
  if (src.mode() === 'link') {
    const url = src.url();
    if (!/^https?:\/\//i.test(url)) { toast('L’enllaç ha de començar per https://'); return null; }
    return { url, file: null };
  }
  const f = src.picked();
  if (!f) {
    if (previous?.file) return { url: '', file: previous.file };
    toast('Tria un fitxer'); return null;
  }
  if (!navigator.onLine) { toast('Cal connexió per pujar el fitxer'); return null; }
  const label = btn.textContent;
  btn.disabled = true;
  try {
    const file = await uploadFile(f, (i, n) => { btn.textContent = n > 1 ? `Pujant ${i} de ${n}…` : 'Pujant…'; });
    return { url: '', file };
  } catch {
    toast('No s’ha pogut pujar el fitxer. Torna-ho a provar.');
    return null;
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* ================= Sheets ================= */
let sheetClose = null;
function openSheet({ title, body, foot = '', onMount, wide }) {
  closeSheet();
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-back" data-sheet-back>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="max-width:680px"' : ''}>
      <div class="sheet-h"><h2 class="h2">${esc(title)}</h2><button class="icon-btn" data-act="sheet-close" aria-label="Tanca">${ICON.close}</button></div>
      <div class="sheet-b">${body}</div>
      ${foot ? `<div class="sheet-f">${foot}</div>` : ''}
    </div></div>`;
  const back = root.firstElementChild;
  const prevFocus = document.activeElement;
  back.addEventListener('click', e => { if (e.target === back) closeSheet(); });
  const onKey = e => { if (e.key === 'Escape') closeSheet(); };
  document.addEventListener('keydown', onKey);
  document.body.style.overflow = 'hidden';
  sheetClose = () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; root.innerHTML = ''; prevFocus?.focus?.({ preventScroll: true }); };
  const first = back.querySelector('.sheet-b input:not([type=checkbox]):not([type=file]), .sheet-b textarea');
  if (onMount) onMount(back.querySelector('.sheet'));
  if (first && window.matchMedia('(hover:hover)').matches) first.focus();
  else back.querySelector('[data-act="sheet-close"]').focus({ preventScroll: true });
}
function closeSheet() { if (sheetClose) { const f = sheetClose; sheetClose = null; f(); } }

function confirmSheet(title, text, ok = 'Confirma', danger = true) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeSheet(); resolve(v); };
    openSheet({
      title, body: `<p style="margin:0">${text}</p>`,
      foot: `<button class="btn" id="cf-no">Cancel·la</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cf-yes">${esc(ok)}</button>`,
      onMount: el => {
        el.querySelector('#cf-no').onclick = () => finish(false);
        el.querySelector('#cf-yes').onclick = () => finish(true);
        const prev = sheetClose;
        sheetClose = () => { prev(); if (!done) { done = true; resolve(false); } };
      },
    });
  });
}

let toastTimer = null;
function toast(msg, action) {
  const root = $('#toast-root');
  clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button id="toast-act">${esc(action.label)}</button>` : ''}</div>`;
  if (action) $('#toast-act').onclick = () => { root.innerHTML = ''; action.run(); };
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, action ? 6000 : 2600);
}

/* ---------- Sheet: summary ---------- */
function summaryText(session, secs) {
  const prod = S.productions.get(session.prodId);
  const lines = [`${prodNames(session)} — ${session.type || 'Assaig'} ${ddmm(session.date)}${session.time ? ' ' + timeRange(session) : ''}`];
  for (const sec of secs) {
    if (!convoked(session, sec)) continue;
    const ms = membersOf(sec);
    const groups = { P: [], R: [], FNJ: [], FJ: [], NP: [], none: [] };
    for (const m of ms) { const mk = effMark(session, m); groups[mk ? mk.s : 'none'].push({ m, mk }); }
    lines.push('', `${SEC[sec].name.toUpperCase()} · ${groups.P.length + groups.R.length}/${ms.length - groups.NP.length} hi són`);
    if (groups.R.length) lines.push(`Retards: ${groups.R.map(({ m, mk }) => `${m.name}${mk.min ? ` (${mk.min}′)` : ''}`).join(', ')}`);
    if (groups.FNJ.length) lines.push(`Faltes no justificades: ${groups.FNJ.map(({ m, mk }) => m.name + (mk.note ? ` (${mk.note})` : '')).join(', ')}`);
    if (groups.FJ.length) lines.push(`Faltes justificades: ${groups.FJ.map(({ m, mk }) => m.name + (mk.note ? ` (${mk.note})` : '')).join(', ')}`);
    if (groups.none.length) lines.push(`Sense marcar: ${groups.none.map(({ m }) => m.name).join(', ')}`);
    if (!groups.R.length && !groups.FNJ.length && !groups.FJ.length && !groups.none.length) lines.push('Tothom present i puntual.');
  }
  return lines.join('\n');
}

    body: `<div class="kv">

      <div class="row2"><label class="field"><span>Data</span><input class="inp" id="se-date" type="date" value="${cur.date}"></label>
      <label class="field"><span>Tipus</span><select class="inp" id="se-type">${[...new Set([...TYPES, cur.type].filter(Boolean))].map(t => `<option ${t === cur.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label></div>
      <div class="row2"><label class="field"><span>Hora d’inici</span><input class="inp" id="se-time" type="time" value="${esc(cur.time || '')}"></label>
      <label class="field"><span>Hora de final</span><input class="inp" id="se-end" type="time" value="${esc(cur.end || '')}"></label></div>
      <label class="field"><span>Lloc</span><input class="inp" id="se-place" type="text" maxlength="60" value="${esc(cur.place || '')}" placeholder="Sala d’assaig"></label>
      <div class="field"><span>${V.Sections} convocades</span><div class="pickers" id="se-secs">${SECTIONS.map(x => secPick(x, secs.has(x.id))).join('')}</div></div>
      <div class="toggle-row"><span><b>Demana confirmació</b><br><span class="muted" style="font-size:12.5px">Els ${V.members} convocats responen si hi seran</span></span><label class="switch"><input type="checkbox" id="se-rsvp" ${cur.rsvp ? 'checked' : ''}><span></span></label></div>
      <label class="field" id="se-rsvpby-f" ${cur.rsvp ? '' : 'hidden'}><span>Respondre abans del (opcional)</span><input class="inp" id="se-rsvpby" type="date" value="${esc(cur.rsvpBy || '')}"></label>
      <div class="field"><span>També compta per a</span><div class="pickers" id="se-also">${prods.map(p => `<button type="button" class="pick" data-also="${p.id}" aria-pressed="${(cur.alsoIn || []).includes(p.id)}">${esc(p.name)}</button>`).join('')}</div>
        <small>Per a assajos compartits entre produccions: comptaran a les estadístiques i a la norma de totes les marcades.</small></div>
      <label class="field"><span>Nota</span><input class="inp" id="se-note" type="text" maxlength="80" value="${esc(cur.note || '')}" placeholder="p. ex. Portar partitures del Gloria"></label>
      <details class="fitxa-edit" id="se-fitxa" ${isShow(cur) || hasInfo(cur) ? 'open' : ''}>
        <summary><span><b>Fitxa ${V.sh.del}</b><br><span class="muted" style="font-size:12.5px">Convocatòria, vestuari, punt de trobada… La veuen tots els convocats.</span></span>${ICON.chev}</summary>
        <div class="kv" style="margin-top:12px">
          <label class="field"><span>Hora de convocatòria</span><input class="inp" id="se-call" type="time" style="max-width:170px" value="${esc(cur.info?.call || '')}"><small>A quina hora han de ser-hi els ${V.members}.</small></label>
          <label class="field"><span>Vestuari</span><input class="inp" id="se-dress" type="text" maxlength="100" value="${esc(cur.info?.dress || '')}" placeholder="p. ex. Uniforme negre i fulard lila"></label>
          <label class="field"><span>Punt de trobada</span><input class="inp" id="se-meet" type="text" maxlength="100" value="${esc(cur.info?.meet || '')}" placeholder="p. ex. Entrada d’artistes, c. Sant Pere Més Alt"></label>
          <label class="field"><span>Cal portar</span><input class="inp" id="se-bring" type="text" maxlength="120" value="${esc(cur.info?.bring || '')}" placeholder="p. ex. Carpeta negra, partitures i aigua"></label>
          <label class="field"><span>Altres indicacions</span><textarea class="inp" id="se-extra" maxlength="500" style="min-height:70px" placeholder="p. ex. Prova acústica a les 19:00 a l’escenari">${esc(cur.info?.extra || '')}</textarea></label>
        </div>
      </details>
    </div>`,
    foot: `${existing ? '<button class="btn btn-danger-ghost" id="se-del">Esborra</button>' : ''}<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="se-save">Desa</button>`,
    onMount: el => {
      el.querySelectorAll('#se-secs .pick').forEach(b => b.onclick = () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        if (!on && el.querySelectorAll('#se-secs .pick[aria-pressed="true"]').length === 1) return;
        b.setAttribute('aria-pressed', on);
      });
      el.querySelectorAll('#se-also .pick').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
      el.querySelector('#se-rsvp').onchange = e => { el.querySelector('#se-rsvpby-f').hidden = !e.target.checked; };
      el.querySelector('#se-type').onchange = e => { if (SHOWS.has(e.target.value)) el.querySelector('#se-fitxa').open = true; };
      el.querySelector('#se-save').onclick = () => {
        const date = el.querySelector('#se-date').value;
        if (!date) { toast('Indica la data de la sessió'); return; }
        const chosen = $$('#se-secs .pick[aria-pressed="true"]', el).map(b => b.dataset.sec);
        const next = {
          id: cur.id, date, time: el.querySelector('#se-time').value, end: el.querySelector('#se-end').value, type: el.querySelector('#se-type').value,
          place: el.querySelector('#se-place').value.trim(), note: el.querySelector('#se-note').value.trim(),
        };
        if (chosen.length && chosen.length < SECTIONS.length) next.sections = chosen;
        const prodId = el.querySelector('#se-prod').value;
        const also = $$('#se-also .pick[aria-pressed="true"]', el).map(b => b.dataset.also).filter(id => id !== prodId);
        if (also.length) next.alsoIn = also;
        if (el.querySelector('#se-rsvp').checked) { next.rsvp = true; const by = el.querySelector('#se-rsvpby').value; if (by) next.rsvpBy = by; }
        const info = Object.fromEntries(INFO_FIELDS.map(([k]) => [k, el.querySelector(`#se-${k}`).value.trim()]).filter(([, v]) => v));
        if (Object.keys(info).length) next.info = info;
        if (existing && existing.prodId !== prodId) {
          const old = clone(S.productions.get(existing.prodId));
          old.sessions = (old.sessions || []).filter(s => s.id !== cur.id);
          saveProduction(old);
        }
        const p = clone(S.productions.get(prodId));
        p.sessions = (p.sessions || []).filter(s => s.id !== cur.id).concat(next).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        saveProduction(p);
        closeSheet();
        toast(existing ? 'Sessió desada' : 'Sessió creada');
        render();
      };
      const del = el.querySelector('#se-del');
      if (del) del.onclick = async () => {
        const marked = SECTIONS.some(x => hasData(existing, x.id));
        const ok = await confirmSheet('Esborrar la sessió?', `${longDate(existing.date)}${marked ? ' ja té llista passada; també se n’esborrarà l’assistència.' : ''}`, 'Esborra la sessió');
        if (!ok) return;
        const p = clone(S.productions.get(existing.prodId));
        p.sessions = (p.sessions || []).filter(s => s.id !== existing.id);
        saveProduction(p);
        removeMany(SECTIONS.map(x => ['attendance', attKey(existing.id, x.id)]).filter(([, k]) => S.attendance.has(k)));
        if (ui.sessionId === existing.id) ui.sessionId = null;
        toast('Sessió esborrada');
        render();
      };
    },
  });
}

/* ---------- Sheet: member ---------- */
function sheetMember(mid) {
  const existing = mid ? S.members.get(mid) : null;
  const m = existing ? clone(existing) : { id: uid('m'), name: '', section: ui.section, leader: false, active: true, phone: '', notes: '' };
  openSheet({
    title: existing ? V.Member : `Nou ${V.member}`,
    body: `<div class="kv">
      <label class="field"><span>Nom i cognoms</span><input class="inp" id="me-name" type="text" maxlength="60" value="${esc(m.name)}" autocomplete="off"></label>
      <div class="field"><span>${V.Section}</span><div class="pickers" id="me-sec">${SECTIONS.map(x => secPick(x, m.section === x.id)).join('')}</div></div>
      <div class="field"><span>${V.Part} dins la ${V.section}</span><div class="pickers" id="me-part"><button type="button" class="pick" data-part="" aria-pressed="${!m.part}">Sense</button>${PARTS.map(v => `<button type="button" class="pick" data-part="${v}" aria-pressed="${m.part === v}">${v}</button>`).join('')}</div></div>
      <div class="toggle-row"><span><b>${V.Leader}</b><br><span class="muted" style="font-size:12.5px">Passa llista de la seva ${V.section}</span></span><label class="switch"><input type="checkbox" id="me-leader" ${m.leader ? 'checked' : ''}><span></span></label></div>
      <fieldset class="fieldset"><legend>Baixes temporals</legend>
        <div id="me-leaves" style="display:grid;gap:6px"></div>
        <div class="row3"><label class="field"><span>Des del</span><input class="inp" id="lv-from" type="date"></label><label class="field"><span>Fins al</span><input class="inp" id="lv-to" type="date"></label></div>
        <label class="field"><span>Motiu</span><input class="inp" id="lv-note" type="text" maxlength="60" placeholder="p. ex. Erasmus, lesió…"></label>
        <button type="button" class="btn btn-sm" id="lv-add" style="width:max-content">Afegeix la baixa</button>
        <small class="muted">Durant la baixa surt en gris («No fa») i no compta a les estadístiques ni a la norma.</small>
      </fieldset>
      <div class="toggle-row"><span><b>Actiu</b><br><span class="muted" style="font-size:12.5px">Desactiva’l si deixa ${V.el}; conserva l’historial</span></span><label class="switch"><input type="checkbox" id="me-active" ${m.active !== false ? 'checked' : ''}><span></span></label></div>
      ${existing ? (x => `<div class="toggle-row"><span><b>Accés a l’app</b><br><span class="muted" style="font-size:12.5px">${x ? esc(x.email) : 'Encara no en té'}</span></span><button type="button" class="btn btn-sm" data-act="${x ? 'staff-edit' : 'staff-new'}" ${x ? `data-email="${esc(x.email)}"` : ''}>${x ? 'Canvia' : 'Dona-li accés'}</button></div>`)(accountFor(m.id)) : ''}
      <label class="field"><span>Telèfon</span><input class="inp" id="me-phone" type="tel" maxlength="20" value="${esc(m.phone || '')}"></label>
      <label class="field"><span>Notes</span><input class="inp" id="me-notes" type="text" maxlength="120" value="${esc(m.notes || '')}"></label>
    </div>`,
    foot: `${existing ? '<button class="btn btn-danger-ghost" id="me-del">Esborra</button>' : ''}<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="me-save">Desa</button>`,
    onMount: el => {
      el.querySelectorAll('#me-sec .pick').forEach(b => b.onclick = () => { el.querySelectorAll('#me-sec .pick').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      el.querySelectorAll('#me-part .pick').forEach(b => b.onclick = () => { el.querySelectorAll('#me-part .pick').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      m.leaves = [...(m.leaves || [])];
      const drawLeaves = () => {
        el.querySelector('#me-leaves').innerHTML = m.leaves.length ? m.leaves.map((l, i) => `<div class="leave-row"><span><span class="mono">${ddmm(l.from)}/${l.from.slice(2, 4)} – ${l.to ? `${ddmm(l.to)}/${l.to.slice(2, 4)}` : 'sense data'}</span>${l.note ? ` · ${esc(l.note)}` : ''}</span><button type="button" class="icon-btn" data-lv="${i}" aria-label="Treu la baixa">${ICON.close}</button></div>`).join('') : '<span class="muted" style="font-size:13px">Cap baixa.</span>';
        el.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { m.leaves.splice(+b.dataset.lv, 1); drawLeaves(); });
      };
      drawLeaves();
      el.querySelector('#lv-add').onclick = () => {
        const from = el.querySelector('#lv-from').value, to = el.querySelector('#lv-to').value;
        if (!from || (to && to < from)) { toast('Indica una data d’inici (i un final posterior)'); return; }
        m.leaves.push({ from, to, note: el.querySelector('#lv-note').value.trim() });
        m.leaves.sort((a, b) => a.from.localeCompare(b.from));
        ['#lv-from', '#lv-to', '#lv-note'].forEach(q => { el.querySelector(q).value = ''; });
        drawLeaves();
      };
      el.querySelector('#me-save').onclick = () => {
        const name = el.querySelector('#me-name').value.trim();
        if (!name) { toast('Escriu el nom i els cognoms'); return; }
        const section = el.querySelector('#me-sec .pick[aria-pressed="true"]').dataset.sec;
        if (existing && existing.section !== section && [...S.attendance.values()].some(d => d.section === existing.section && d.marks?.[m.id])) {
          toast(`Canvi de ${V.section} desat. Les llistes antigues queden a la ${V.section} anterior.`);
        }
        const next = { ...m, name, section, leader: el.querySelector('#me-leader').checked, active: el.querySelector('#me-active').checked, phone: el.querySelector('#me-phone').value.trim(), notes: el.querySelector('#me-notes').value.trim(), part: el.querySelector('#me-part .pick[aria-pressed="true"]').dataset.part };
        if (next.leader) for (const o of membersOf(section, true)) if (o.id !== next.id && o.leader) saveMember({ ...o, leader: false });
        saveMember(next);
        closeSheet();
        render();
      };
      const del = el.querySelector('#me-del');
      if (del) del.onclick = async () => {
        const ok = await confirmSheet(`Esborrar la fitxa?`, `S’esborrarà <b>${esc(existing.name)}</b> i deixarà de sortir a les estadístiques. Si només és una baixa, desactiva’l.`, 'Esborra');
        if (!ok) return;
        S.members.delete(existing.id); persist('members', existing.id, null, 20);
        toast('Fitxa esborrada');
        render();
      };
    },
  });
}
function sheetBulk(sec) {
  openSheet({
    title: `Afegeix ${SEC[sec].name.toLowerCase()}`,
    body: `<div class="kv">
      <div class="field"><span>${V.Section}</span><div class="pickers" id="bk-sec">${SECTIONS.map(x => secPick(x, sec === x.id)).join('')}</div></div>
      <label class="field"><span>Noms, un per línia</span><textarea class="inp" id="bk-names" placeholder="Anna Puig&#10;Laia Ferrer&#10;Marta Soler"></textarea><small>Pots enganxar-los directament des d’un full de càlcul.</small></label>
    </div>`,
    foot: `<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="bk-save">Afegeix</button>`,
    onMount: el => {
      el.querySelectorAll('#bk-sec .pick').forEach(b => b.onclick = () => { el.querySelectorAll('#bk-sec .pick').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      el.querySelector('#bk-save').onclick = async () => {
        const section = el.querySelector('#bk-sec .pick[aria-pressed="true"]').dataset.sec;
        const existingNames = new Set([...S.members.values()].map(m => m.name.toLowerCase()));
        const names = [...new Set(el.querySelector('#bk-names').value.split(/\r?\n/).map(s => s.replace(/\t.*/, '').trim()).filter(Boolean))].filter(n => !existingNames.has(n.toLowerCase()));
        if (!names.length) { toast('No hi ha noms nous per afegir'); return; }
        closeSheet();
        for (const name of names) { saveMember({ id: uid('m'), name, section, leader: false, active: true }); await sleep(8); }
        toast(`${names.length} ${names.length === 1 ? V.member : V.members} afegits a ${SEC[section].name}`);
        render();
      };
    },
  });
}

/* ---------- Sheet: member stats ---------- */
function sheetMemberStats(mid) {
  const m = S.members.get(mid);
  if (!m) return;
  const scope = currentScope();
  const st = computeStats(scope, m.section);
  const rs = scope.kind === 'prod' ? ruleStatus(scope.id, m) : null;
  const r = st.rows.find(x => x.m.id === mid) || { ...emptyCounts(), hist: [], notes: [] };
  const hist = r.hist.map(({ s, mk }) => `<button class="hcell" data-act="open-session" data-sid="${s.id}" title="${longDate(s.date)} · ${mk ? STATUS[mk.s].label + (mk.min ? ` ${mk.min}′` : '') : 'Sense llista'}"><i class="${mk ? 's-' + mk.s : ''}"></i>${ddmm(s.date)}</button>`).join('');
  openSheet({
    title: m.name,
    body: `<div class="eyebrow" style="margin-bottom:10px">${SEC[m.section].name} · ${esc(scope.name)}</div>
      ${rs ? `<div class="notice" style="margin:0 0 12px;background:${rs.status === 'ok' ? 'var(--p-soft)' : rs.status === 'risk' ? 'var(--fj-soft)' : 'var(--fnj-soft)'};border:0">
        <b>${rs.status === 'ok' ? `Compleix la norma del ${minAttendance()}%` : rs.status === 'risk' ? 'En risc de no poder fer el concert' : 'No pot fer el concert'}</b>
        <span>Assistència als assajos: ${pct(rs.cur)} (${rs.att} de ${rs.att + rs.abs})${rs.remaining ? ` · queden ${rs.remaining} assajos, màxim possible ${pct(rs.best)}` : ''}.</span></div>` : ''}
      ${leaveText(m) ? `<p class="muted" style="margin:0 0 10px;font-size:13px">${leaveText(m)}</p>` : ''}
      <div class="kpis" style="grid-template-columns:repeat(2,1fr)">
        <div class="kpi"><div class="kpi-v">${pct(rate(r))}</div><div class="kpi-l">Assistència</div></div>
        <div class="kpi"><div class="kpi-v">${r.min}<small>min</small></div><div class="kpi-l">${r.R} retards</div></div>
        <div class="kpi ${r.FNJ ? 'alert' : ''}"><div class="kpi-v">${r.FNJ}</div><div class="kpi-l">Faltes no justificades</div></div>
        <div class="kpi"><div class="kpi-v">${r.FJ}</div><div class="kpi-l">Faltes justificades</div></div>
      </div>
      <div class="section-title" style="margin-top:20px"><h3 class="eyebrow">Sessió a sessió</h3></div>
      ${hist ? `<div class="hist">${hist}</div>` : '<p class="muted">Encara no hi ha sessions passades.</p>'}
      <div class="legend">${ORDER.map(k => `<span><i class="i-${k}"></i>${STATUS[k].short}</span>`).join('')}<span><i class="i-none"></i>Sense llista</span></div>
      ${r.notes.length ? `<div class="section-title" style="margin-top:20px"><h3 class="eyebrow">Motius registrats</h3></div>
      <ul class="notes-list">${r.notes.map(({ s, mk }) => `<li><span class="mono muted">${ddmm(s.date)}</span><span><span class="pill ${mk.s === 'FNJ' ? 'fnj' : ''}" style="${mk.s === 'FJ' ? 'background:var(--fj-soft);color:var(--ink)' : ''}">${mk.s}</span> ${esc(mk.note)}</span></li>`).join('')}</ul>` : ''}
      ${m.phone ? `<p style="margin-top:18px"><a class="btn btn-sm" href="tel:${esc(m.phone.replace(/\s/g, ''))}">Truca ${esc(m.phone)}</a></p>` : ''}`,
  });
}

/* ---------- Sheet: production ---------- */
function sheetProduction(pid) {
  const existing = pid ? S.productions.get(pid) : null;
  const d = existing ? clone(existing) : { id: uid('p'), name: '', start: TODAY, end: '', sessions: [], excluded: [] };
  d.sessions = d.sessions || []; d.excluded = d.excluded || [];
  const excluded = new Set(d.excluded);
  const gen = { from: d.start || TODAY, to: d.end || '', days: new Set(['1', '3']), time: '20:30', end: '22:30', type: 'Assaig', place: '' };

  const sessionsList = () => d.sessions.length
    ? `<ul class="mini-list" id="pe-sessions">${[...d.sessions].sort((a, b) => a.date.localeCompare(b.date)).map(s => `<li><span><span class="mono">${ddmm(s.date)} ${wdShort(s.date)}</span> · ${esc(s.type)} <span class="mono">${esc(timeRange(s))}</span></span><button class="icon-btn" data-rm="${s.id}" aria-label="Treu la sessió">${ICON.close}</button></li>`).join('')}</ul>`
    : '<p class="muted" style="margin:0;font-size:13.5px">Encara no hi ha sessions.</p>';

  openSheet({
    title: existing ? 'Edita la producció' : 'Nova producció', wide: true,
    body: `<div class="kv">
      <label class="field"><span>Nom</span><input class="inp" id="pe-name" type="text" maxlength="60" value="${esc(d.name)}" placeholder="p. ex. Concert de Nadal 2026"></label>
      <div class="field"><span>Color al calendari</span><div class="pickers" id="pe-hue">${PROD_HUES.map(h => `<button type="button" class="hue-pick prod-tone" style="--ph:${h}" data-hue="${h}" aria-pressed="${prodHue(d) === h}" aria-label="Color ${h}"></button>`).join('')}</div></div>
      <div class="row2"><label class="field"><span>Inici</span><input class="inp" id="pe-start" type="date" value="${d.start || ''}"></label>
      <label class="field"><span>Final</span><input class="inp" id="pe-end" type="date" value="${d.end || ''}"></label></div>

      <fieldset class="fieldset"><legend>Sessions</legend>
        <div id="pe-slist">${sessionsList()}</div>
        <details id="pe-gen" ${d.sessions.length ? '' : 'open'}><summary class="btn btn-sm" style="list-style:none;width:max-content">Genera sessions recurrents</summary>
          <div class="kv" style="margin-top:12px">
            <div class="row2"><label class="field"><span>Des de</span><input class="inp" id="g-from" type="date" value="${gen.from}"></label>
            <label class="field"><span>Fins a</span><input class="inp" id="g-to" type="date" value="${gen.to}"></label></div>
            <div class="field"><span>Dies</span><div class="pickers" id="g-days">${WEEKDAYS.map(([v, l]) => `<button type="button" class="pick" aria-pressed="${gen.days.has(v)}" data-d="${v}">${l}</button>`).join('')}</div></div>
            <div class="row2"><label class="field"><span>Hora d’inici</span><input class="inp" id="g-time" type="time" value="${gen.time}"></label>
            <label class="field"><span>Hora de final</span><input class="inp" id="g-end" type="time" value="${gen.end}"></label></div>
            <label class="field"><span>Tipus</span><select class="inp" id="g-type">${TYPES.map(t => `<option>${t}</option>`).join('')}</select></label>
            <label class="field"><span>Lloc</span><input class="inp" id="g-place" type="text" maxlength="60" placeholder="Sala d’assaig"></label>
            <button type="button" class="btn btn-sm btn-primary" id="g-run" style="width:max-content">Afegeix les sessions</button>
          </div></details>
      </fieldset>

      <fieldset class="fieldset"><legend>Qui no fa aquesta producció</legend>
        <p class="muted" style="margin:0;font-size:12.5px">Els marcats sortiran en gris («No fa») a totes les sessions i no comptaran a les estadístiques.</p>
        ${SECTIONS.map(x => { const ms = membersOf(x.id); return ms.length ? `<div class="field"><span>${x.name}</span><div class="pickers">${ms.map(mm => `<button type="button" class="pick" data-ex="${mm.id}" aria-pressed="${excluded.has(mm.id)}">${esc(mm.name)}</button>`).join('')}</div></div>` : ''; }).join('')}
      </fieldset>
    </div>`,
    foot: `${existing ? '<button class="btn btn-danger-ghost" id="pe-del">Esborra</button>' : ''}<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="pe-save">Desa</button>`,
    onMount: el => {
      const bindRm = () => el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { d.sessions = d.sessions.filter(s => s.id !== b.dataset.rm); el.querySelector('#pe-slist').innerHTML = sessionsList(); bindRm(); });
      bindRm();
      el.querySelectorAll('#g-days .pick').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
      el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
      el.querySelectorAll('#pe-hue .hue-pick').forEach(b => b.onclick = () => el.querySelectorAll('#pe-hue .hue-pick').forEach(x => x.setAttribute('aria-pressed', x === b)));
      el.querySelector('#pe-start').onchange = e => { if (!el.querySelector('#g-from').value || !d.sessions.length) el.querySelector('#g-from').value = e.target.value; };
      el.querySelector('#pe-end').onchange = e => { if (!el.querySelector('#g-to').value) el.querySelector('#g-to').value = e.target.value; };
      el.querySelector('#g-run').onclick = () => {
        const from = el.querySelector('#g-from').value, to = el.querySelector('#g-to').value;
        const days = new Set($$('#g-days .pick[aria-pressed="true"]', el).map(b => +b.dataset.d));
        if (!from || !to || to < from) { toast('Indica unes dates d’inici i final vàlides'); return; }
        if (!days.size) { toast('Tria almenys un dia de la setmana'); return; }
        const time = el.querySelector('#g-time').value, end = el.querySelector('#g-end').value, type = el.querySelector('#g-type').value, place = el.querySelector('#g-place').value.trim();
        const have = new Set(d.sessions.map(s => s.date + s.time));
        let n = 0;
        for (let dt = parseISO(from); isoDate(dt) <= to && n < 200; dt.setDate(dt.getDate() + 1)) {
          if (!days.has(dt.getDay())) continue;
          const iso = isoDate(dt);
          if (have.has(iso + time)) continue;
          d.sessions.push({ id: uid('s'), date: iso, time, end, type, place, note: '' }); n++;
        }
        el.querySelector('#pe-slist').innerHTML = sessionsList(); bindRm();
        toast(n ? `${n} sessions afegides. Recorda desar.` : 'No s’ha afegit cap sessió nova');
      };
      el.querySelector('#pe-save').onclick = () => {
        const name = el.querySelector('#pe-name').value.trim();
        if (!name) { toast('Posa un nom a la producció'); return; }
        d.name = name;
        d.start = el.querySelector('#pe-start').value || (d.sessions[0]?.date ?? TODAY);
        d.end = el.querySelector('#pe-end').value;
        d.excluded = $$('[data-ex][aria-pressed="true"]', el).map(b => b.dataset.ex);
        const hueBtn = el.querySelector('#pe-hue .hue-pick[aria-pressed="true"]');
        if (hueBtn) d.hue = +hueBtn.dataset.hue;
        d.sessions.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        const removed = (existing?.sessions || []).filter(s => !d.sessions.some(x => x.id === s.id));
        saveProduction(d);
        if (removed.length) removeMany(removed.flatMap(s => SECTIONS.map(x => ['attendance', attKey(s.id, x.id)])).filter(([, k]) => S.attendance.has(k)));
        closeSheet();
        toast(existing ? 'Producció desada' : 'Producció creada');
        render();
      };
      const del = el.querySelector('#pe-del');
      if (del) del.onclick = async () => {
        const ok = await confirmSheet('Esborrar la producció?', `S’esborraran <b>${esc(existing.name)}</b>, les seves ${(existing.sessions || []).length} sessions i tota l’assistència registrada.`, 'Esborra la producció');
        if (!ok) return;
        const att = (existing.sessions || []).flatMap(s => SECTIONS.map(x => ['attendance', attKey(s.id, x.id)])).filter(([, k]) => S.attendance.has(k));
        S.productions.delete(existing.id); persist('productions', existing.id, null, 20);
        (existing.materials || []).forEach(x => deleteFile(x.file));
        await removeMany(att);
        toast('Producció esborrada');
        render();
      };
    },
  });
}

    foot: `<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="ab-send">${singer ? 'Envia l’avís' : 'Desa l’avís'}</button>`,
    onMount: el => {
      const drawSessions = () => {

        if (!m) { toast('Tria qui no hi podrà anar'); return; }

  });

const mailAddr = e => String(e).replace(/\+/g, '%2B');

/** Remember who has been invited, so the list says who is still pending. */
async function markInvited(emails) {
  const at = new Date().toISOString();

  try {
    for (let i = 0; i < list.length; i += 400) {
      const b = fs.batch();
      for (const e of list.slice(i, i + 400)) { b.update(db.doc(`staff/${e}`), { invitedAt: at }); S.staff.set(e, { ...S.staff.get(e), invitedAt: at }); }
      await b.commit();
    }
  } catch {}

/** Paste a list of «name — email» lines and match them to the roster. */
function sheetStaffBulk() {

    for (const c of cands) {

      const exact = roster.find(r => r.key === c);
      if (exact) return exact.m;
      const words = c.split(' ').filter(w => w.length > 2);
      if (words.length < 2) continue;

  };

    title: 'Afegeix correus en bloc',
    wide: true,
    body: `<p style="margin-top:0">Enganxa una línia per persona, amb el nom i el correu en qualsevol ordre. Per exemple:</p>
      <div class="linkbox">Quingles, Pol — pol@exemple.com<br>Mata, Martina &lt;martina@exemple.com&gt;<br>anna@exemple.com</div>
      <label class="field" style="margin-top:12px"><span>Llista</span><textarea class="inp" id="bk-text" style="min-height:150px" placeholder="Cognom, Nom  correu@exemple.com"></textarea></label>
      <div class="field"><span>Rol per a tothom</span><div class="pickers" id="bk-role">${ROLE_KEYS.map(k => `<button type="button" class="pick" data-role="${k}" aria-pressed="${k === 'singer'}">${esc(roleLabel(k))}</button>`).join('')}</div>
        <small>Qui ja hi era conserva els rols que tenia i hi suma aquest. Els altres rols es donen d’un en un.</small></div>
      <div id="bk-prev" style="margin-top:10px"></div>`,
    foot: `<button class="btn" id="bk-check">Comprova</button><span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="bk-save">Desa’ls</button>`,
    onMount: el => {

      el.querySelectorAll('#bk-role .pick').forEach(b => b.onclick = () => el.querySelectorAll('#bk-role .pick').forEach(x => x.setAttribute('aria-pressed', x === b)));
      el.querySelector('#bk-check').onclick = () => { rows = parse(el.querySelector('#bk-text').value); draw(el); };

        if (!rows.length) rows = parse(el.querySelector('#bk-text').value);

    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (!sub || Notification.permission !== 'granted') { S.pushOn = false; scheduleRender(); return; }
    swReg = reg;

    const snap = saved ? null : await db.doc(`push/${pushId()}`).get().catch(() => null);
    if (snap && snap.exists) saved = { prefs: snap.data().prefs, cordes: snap.data().cordes };

    S.pushOn = true;
    S.pushPrefs = saved.prefs || S.pushPrefs; S.pushCordes = Array.isArray(saved.cordes) ? saved.cordes : S.pushCordes;

/* ---------- Comprovador de correus ---------- */
const MAIL_DOMAINS = ['gmail.com', 'hotmail.com', 'outlook.com', 'outlook.es', 'icloud.com', 'yahoo.com', 'yahoo.es', 'live.com', 'me.com', 'orfeocatala.cat', 'palaumusica.cat'];
function mailWarning(mail) {
  const at = String(mail || '').split('@');
  if (at.length !== 2) return 'No sembla un correu';
  const dom = at[1].toLowerCase();
  if (!dom.includes('.')) return 'Al domini li falta el punt';
  if (/\s/.test(mail)) return 'Té un espai';
  if (MAIL_DOMAINS.includes(dom)) return null;
  const near = MAIL_DOMAINS.find(d => Math.abs(d.length - dom.length) <= 2 && levenshtein(d, dom) <= 2);
  return near ? `Volies dir ${near}?` : null;
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function mailProblems() {
  const out = [];
  const seenMember = new Map();
  for (const p of S.staff.values()) {
    const w = mailWarning(p.email);
    if (w) out.push({ kind: 'mail', email: p.email, name: p.name, text: w });
    if (hasRole(p, 'singer') && !p.memberId) out.push({ kind: 'link', email: p.email, name: p.name, text: `${V.Member} sense fitxa de la plantilla` });
    if (p.memberId) {
      const m = S.members.get(p.memberId);
      if (!m) out.push({ kind: 'link', email: p.email, name: p.name, text: 'Vinculat a una fitxa que ja no hi és' });
      else if (m.active === false) out.push({ kind: 'inactive', email: p.email, name: p.name, text: `${m.name} ja no hi és (fitxa inactiva)` });
      if (seenMember.has(p.memberId)) out.push({ kind: 'dup', email: p.email, name: p.name, text: `Aquesta fitxa també és de ${seenMember.get(p.memberId)}` });
      else seenMember.set(p.memberId, p.email);
    }
  }
  return out;
}

/* ---------- Calendar subscription ---------- */
// La primera agrupació conserva l'adreça d'abans; la resta tenen la seva a calendaris/<agrupació>.ics.
const icsUrl = () => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}${GID === FOUNDER ? 'calendari.ics' : `calendaris/${GID}.ics`}`;
function icsEscape(t) { return String(t || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function buildIcs(sessions, name) {
  const dt = (d, t) => `${d.replace(/-/g, '')}T${t.replace(':', '')}00`;
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//A Tempo//CA', 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${icsEscape(name)}`, 'X-WR-TIMEZONE:Europe/Madrid'];
  for (const s of sessions) {
    lines.push('BEGIN:VEVENT', `UID:${s.id}@cor-present`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`);
    if (s.time) {
      lines.push(`DTSTART;TZID=Europe/Madrid:${dt(s.date, s.time)}`);
      const end = s.end || `${pad(Math.min(23, +s.time.slice(0, 2) + 2))}:${s.time.slice(3, 5)}`;
      lines.push(`DTEND;TZID=Europe/Madrid:${dt(s.date, end)}`);
    } else {
      const next = new Date(parseISO(s.date).getTime() + 86400000);
      lines.push(`DTSTART;VALUE=DATE:${s.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${isoDate(next).replace(/-/g, '')}`);
    }
    lines.push(`SUMMARY:${icsEscape(`${s.type || 'Assaig'} · ${prodNames(s)}`)}`);
    if (s.place) lines.push(`LOCATION:${icsEscape(s.place)}`);
    const desc = [s.note, s.sections?.length ? `Convocats: ${s.sections.map(x => SEC[x].name).join(', ')}` : ''].filter(Boolean).join('\n');
    if (desc) lines.push(`DESCRIPTION:${icsEscape(desc)}`);
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* ---------- Brand ---------- */
function uploadLogo(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 256, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r) || max; c.height = Math.round(img.height * r) || max;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let data = c.toDataURL('image/png');
      if (data.length > 180000) data = c.toDataURL('image/webp', 0.85);
      if (data.length > 240000) { toast('La imatge és massa gran. Prova amb un PNG més senzill.'); return; }
      saveConfig({ brand: { ...(S.config.brand || {}), logo: data } });
      toast('Logotip desat'); render();
    };
    img.onerror = () => toast('No s’ha pogut llegir la imatge');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function setBrandColor(c) { saveConfig({ brand: { ...(S.config.brand || {}), accent: c } }); render(); }

        const guess = k === 'PDF' ? 'partitura' : k === 'Àudio' ? 'audio' : k === 'Vídeo' ? 'video' : null;

      });
      const saveTo = (p, list) => { const next = { ...p, materials: list }; saveProduction(next); };
      el.querySelector('#mt-save').onclick = async e => {
        if (!title.value.trim() && !src.picked()) { toast('Posa un títol'); return; }
        const got = await resolveSource(src, m, e.currentTarget);
        if (!got) return;
        const rec = { id: m.id, title: title.value.trim() || titleFromFile(got.file?.name || ''), url: got.url, kind: el.querySelector('#mt-kind .pick[aria-pressed="true"]').dataset.k,
          section: el.querySelector('#mt-sec .pick[aria-pressed="true"]').dataset.sec, part: el.querySelector('#mt-part .pick[aria-pressed="true"]').dataset.part,
          at: m.at || new Date().toISOString(), by: m.by || S.me?.email || '' };
        if (got.file) rec.file = got.file;
        if (m.file && m.file.id !== got.file?.id) deleteFile(m.file);
        const p = S.productions.get(el.querySelector('#mt-prod').value);
        saveTo(p, [...(p.materials || []).filter(x => x.id !== rec.id), rec]);
        ui.matProd = p.id; closeSheet(); toast(got.file && got.file !== m.file ? 'Fitxer pujat i desat' : 'Material desat'); render();
      };
      el.querySelector('#mt-del')?.addEventListener('click', async () => {
        if (!await confirmSheet('Esborrar el material?', esc(m.title), 'Esborra')) return;
        const p = S.productions.get(prodId); saveTo(p, (p.materials || []).filter(x => x.id !== m.id));
        deleteFile(m.file); render();
      });
    },
  });
}

/* ================= Import / export ================= */
function offerFile(filename, text, mime) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch { toast('No s’ha pogut preparar el fitxer'); }
}
function exportJSON() {
  const data = { app: 'cor-present', version: 1, exportedAt: new Date().toISOString(), config: S.config,
    members: [...S.members.values()], productions: [...S.productions.values()], attendance: Object.fromEntries(S.attendance), absences: [...S.absences.values()],
    rsvp: [...S.rsvp.values()], announcements: [...S.announcements.values()], polls: [...S.polls.values()], pollVotes: [...S.pollVotes.values()] };
  const slug = (S.config.name || 'agrupacio').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  offerFile(`${slug}-${TODAY}.json`, JSON.stringify(data, null, 2), 'application/json');
}
function exportCSV() {
  const scope = currentScope();
  if (!scope) return;
  const prod = { name: scope.name };
  const st = computeStats(scope, '');
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['Nom', V.Section, 'Assistència %', 'Assisteix', 'Retard', 'Minuts retard', 'Falta no justificada', 'Falta justificada', 'No fa', ...st.sessions.map(s => `${s.date} ${s.type || ''}`)];
  const lines = [head.map(q).join(';')];
  for (const r of st.rows.sort((a, b) => a.m.section.localeCompare(b.m.section) || byName(a.m, b.m))) {
    const byS = new Map(r.hist.map(h => [h.s.id, h.mk]));
    const rt = rate(r);
    lines.push([r.m.name, SEC[r.m.section].name, rt == null ? '' : Math.round(rt * 100), r.P, r.R, r.min, r.FNJ, r.FJ, r.NP,
      ...st.sessions.map(s => { const mk = byS.get(s.id); return mk ? (mk.s === 'R' && mk.min ? `R${mk.min}` : mk.s) : ''; })].map(q).join(';'));
  }
  const slug = prod.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  offerFile(`assistencia-${slug}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
async function importJSON(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('El fitxer no és una còpia vàlida d’A Tempo'); return; }
  if (!data || data.app !== 'cor-present' || !Array.isArray(data.members) || !Array.isArray(data.productions)) { toast('El fitxer no és una còpia vàlida d’A Tempo'); return; }
  const ok = await confirmSheet('Restaurar la còpia?', `Se substituiran les dades actuals per ${data.members.length} ${V.members} i ${data.productions.length} produccions del fitxer.`, 'Restaura');
  if (!ok) return;
  applyData(data, false);
  toast('Còpia restaurada');
}
function applyData(data, demo) {
  const incoming = { members: new Map(data.members.map(m => [m.id, m])), productions: new Map(data.productions.map(p => [p.id, p])), attendance: new Map(Object.entries(data.attendance || {})) };
  // La identitat de l'agrupació (nom, tipus, seccions, imatge) no la canvia ni una còpia ni l'exemple.
  const keep = ['name', 'shortName', 'kind', 'sections', 'types', 'labels', 'brand', 'createdAt', 'icsOn', 'shared', 'onboarded', 'documents'];
  const cfg = Object.fromEntries(Object.entries(data.config || {}).filter(([k]) => !keep.includes(k) || (!demo && k === 'documents')));

async function loadDemo() {
  try {

    if (data.members.some(m => !SEC_MAP[m.section])) {
      const secOf = Object.fromEntries(data.members.map((m, i) => [m.id, SECTIONS[i % SECTIONS.length].id]));
      data.members = data.members.map(m => ({ ...m, section: secOf[m.id], leader: false }));
