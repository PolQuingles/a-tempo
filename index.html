    const marks = SECTIONS.map(x => {
      if (!convoked(s, x.id)) return `<span class="vm off" title="${x.name}: no convocats">${x.id}</span>`;
      const pr = progress(s, x.id);
      const cls = !hasData(s, x.id) ? '' : pr.total && pr.done === pr.total ? 'full' : 'part';
      return `<span class="vm ${cls}" title="${x.name}: ${pr.done}/${pr.total}">${x.id}</span>`;
    }).join('');
    const c = emptyCounts();
    for (const x of SECTIONS) if (convoked(s, x.id) && hasData(s, x.id)) for (const m of membersOf(x.id)) { const mk = effMark(s, m); if (mk) c[mk.s]++; }
    const r = rate(c);
    const rv = s.rsvp ? rsvpCounts(s) : null;
    right = `<span class="cal-right"><span class="vmarks" aria-label="Llista per cordes">${marks}</span>${r != null ? `<span class="cal-pct">${pct(r)}</span>` : rv ? `<span class="cal-badge" title="Confirmacions">${rv.yes}✓ ${rv.no}✗ ${rv.none}?</span>` : ''}</span>`;
  } else {
    const me = S.members.get(myMemberId());
    const mine = me && [...S.absences.values()].find(a => a.memberId === me.id && (a.sessionIds || []).includes(s.id) && a.status !== 'rejected');
    const rv = me && s.rsvp && S.rsvp.get(`${s.id}_${me.id}`);
    right = mine ? `<span class="cal-right"><span class="st-pill st-${mine.status}">${mine.kind === 'late' ? 'Tard' : 'No hi vaig'}</span></span>`
      : rv ? `<span class="cal-right"><span class="rsvp ${rv.answer}">${rv.answer === 'yes' ? 'Hi seré' : 'No hi seré'}</span></span>`
      : s.rsvp && s.date >= TODAY ? '<span class="cal-right"><span class="rsvp none">Confirma</span></span>' : '<span></span>';
  }
  const other = sessionProds(s).filter(id => id !== underProd).map(id => S.productions.get(id)?.name).filter(Boolean);
  const cls = [s.date === TODAY ? 'is-today' : '', s.date < TODAY ? 'is-past' : '', s.type === 'Concert' ? 'type-concert' : ''].join(' ');
  const openAct = staff ? 'open-session' : (s.date >= TODAY ? 'absence-new' : '');
  return `<li class="cal-row ${cls}" data-date="${s.date}">
    <button class="cal-main" ${openAct ? `data-act="${openAct}"` : 'disabled'} data-sid="${s.id}">
      <span class="cal-date"><b>${+s.date.slice(8, 10)}</b><small>${wdShort(s.date)}</small></span>
      <span class="cal-info"><span class="cal-type">${esc(s.type || 'Assaig')}</span><span class="cal-place">${[s.time ? `<span class="mono">${esc(timeRange(s))}</span>` : '', esc(s.place || ''), esc(s.note || ''), other.length ? `També: ${esc(other.join(', '))}` : ''].filter(Boolean).join(' · ')}</span></span>
      ${right}
    </button>
    ${canEdit() ? `<button class="icon-btn" data-act="session-edit" data-sid="${s.id}" aria-label="Edita la sessió">${ICON.more}</button>` : ''}
  </li>`;
}

/* ---------- View: Stats ---------- */
function viewStats() {
  const prods = productionsSorted();
  if (!prods.length) return `<div class="page-head"><h1 class="h1">Estadístiques</h1></div><div class="empty">${staffSvg()}<p>Quan hi hagi produccions amb llistes passades, veuràs aquí l’assistència.</p></div>`;
  const scope = currentScope();
  const { terms } = seasonCfg();
  const st = computeStats(scope, ui.statsSec);
  const scopeTabs = `<div class="subtabs" role="tablist" style="margin-bottom:10px">${[['prod', 'Producció'], ['term', 'Trimestre'], ['season', 'Temporada']].map(([k, l]) => `<button class="subtab" role="tab" aria-selected="${ui.statsScope === k}" data-act="stats-scope" data-k="${k}">${l}</button>`).join('')}</div>`;
  const choice = ui.statsScope === 'prod'
    ? `<div class="chips" role="group" aria-label="Producció">${prods.map(p => `<button class="chip" aria-pressed="${p.id === scope.id}" data-act="stats-prod" data-id="${p.id}"><i class="pdot prod-tone" style="--ph:${prodHue(p)}"></i>${esc(p.name)}</button>`).join('')}</div>`
    : ui.statsScope === 'term'
      ? `<div class="chips" role="group" aria-label="Trimestre">${terms.map((t, i) => `<button class="chip" aria-pressed="${i === ui.statsTerm}" data-act="stats-term" data-i="${i}">${esc(t.name)}</button>`).join('')}</div>`
      : '';
  const secChips = `<div class="chips" role="group" aria-label="Corda" style="padding-bottom:4px">
    <button class="chip" aria-pressed="${!ui.statsSec}" data-act="stats-sec" data-sec="">Tot el cor</button>
    ${SECTIONS.map(x => `<button class="chip" aria-pressed="${ui.statsSec === x.id}" data-act="stats-sec" data-sec="${x.id}">${x.name}</button>`).join('')}</div>`;
  const sub = scope.kind === 'range' ? `<p class="muted mono" style="margin:4px 0 0;font-size:12.5px">${ddmm(scope.from)}/${scope.from.slice(0, 4)} – ${ddmm(scope.to)}/${scope.to.slice(0, 4)}</p>` : '';
  const head = `<div class="page-head"><div><div class="eyebrow">Estadístiques</div><h1 class="h1">${esc(scope.name)}</h1>${sub}</div>
    <button class="btn btn-sm" data-act="export-csv">Exporta CSV</button></div>`;
  const top = head + scopeTabs + choice + secChips;

  if (!st.counted.length) {
    const first = st.all[0];
    return top + `<div class="empty"><p>Encara no s’ha passat llista en cap sessió d’aquest període${st.all.length ? ` (${st.all.length} sessions programades, la primera el ${shortDate(first.date)})` : ''}.</p></div>`;
  }
  const t = st.tot;
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="kpi-v">${kpiPct(rate(t))}</div><div class="kpi-l">Assistència</div></div>
    <div class="kpi"><div class="kpi-v">${kpiPct(punctuality(t))}</div><div class="kpi-l">Puntualitat</div></div>
    <div class="kpi"><div class="kpi-v">${t.min}<small>min</small></div><div class="kpi-l">Retard acumulat · ${t.R} retards</div></div>
    <div class="kpi ${t.FNJ ? 'alert' : ''}"><div class="kpi-v">${t.FNJ}</div><div class="kpi-l">Faltes no justificades · ${t.FJ} just.</div></div>
  </div>
  <p class="muted" style="font-size:12.5px;margin:10px 2px 0">${st.counted.length} de ${st.all.length} sessions amb llista · Assistència = presents i retards sobre convocats (sense comptar «no fa» ni baixes).</p>`;

  const dist = `<div class="panel" style="padding:14px;margin-top:14px">${stackBar(t)}<div class="legend">${ORDER.map(k => `<span><i class="i-${k}"></i>${STATUS[k].label} <b>${t[k]}</b></span>`).join('')}</div></div>`;

  // Norma del concert (only per production)
  let rule = '';
  const ruleMap = new Map();
  if (scope.kind === 'prod') {
    for (const r of st.rows) { const rs = ruleStatus(scope.id, r.m); if (rs) ruleMap.set(r.m.id, rs); }
    const outL = st.rows.filter(r => ruleMap.get(r.m.id)?.status === 'out');
    const riskL = st.rows.filter(r => ruleMap.get(r.m.id)?.status === 'risk');
    const hasConcert = st.all.some(s => s.type === 'Concert');
    const item = (r, rs) => `<li><span><b>${esc(r.m.name)}</b> <span class="muted">· ${SEC[r.m.section].name} · ${pct(rs.cur)}${rs.status === 'risk' ? ` (pot arribar al ${pct(rs.best)})` : ''}</span></span><button class="rule ${rs.status}" data-act="member-stats" data-mid="${r.m.id}">${rs.status === 'out' ? 'No pot fer el concert' : 'En risc'}</button></li>`;
    rule = `<div class="section-title"><h2 class="h2">Norma del ${minAttendance()}%</h2><span class="eyebrow">${hasConcert ? 'per fer el concert' : 'assistència mínima'}</span></div>
      <div class="panel">
        ${outL.length || riskL.length ? `<ul class="alerts">${outL.map(r => item(r, ruleMap.get(r.m.id))).join('')}${riskL.map(r => item(r, ruleMap.get(r.m.id))).join('')}</ul>`
          : `<p style="margin:0;padding:14px;font-size:13.5px">Ara mateix tothom compleix la norma.</p>`}
        <p class="muted" style="margin:0;padding:10px 14px 12px;font-size:12px;border-top:1px solid var(--line)">Compten tots els assajos de la producció (no els concerts ni les sessions «Altres»). «En risc» vol dir que ara està per sota però encara hi pot arribar amb els assajos que queden.</p>
      </div>`;
  }

  const secBars = !ui.statsSec ? `<div class="section-title"><h2 class="h2">Per cordes</h2><span class="eyebrow">assistència</span></div>
    <div class="panel bars">${SECTIONS.map(x => {
      const c = st.bySec[x.id]; const r = rate(c);
      return `<div class="bar-row"><span class="lbl"><em>${x.id}</em>${x.name.slice(0, 7)}${x.name.length > 7 ? '.' : ''}</span>${stackBar(c)}<span class="val">${pct(r)}</span></div>`;
    }).join('')}</div>` : '';

  const cols = st.counted.map(({ s, c }) => {
    const d = c.P + c.R + c.FJ + c.FNJ;
    const seg = k => d ? `<span class="s-${k}" style="height:${(c[k] / d) * 100}%;background:var(--${k.toLowerCase()})"></span>` : '';
    return `<button class="tcol" data-act="open-session" data-sid="${s.id}" title="${shortDate(s.date)} · ${s.type || 'Assaig'} · ${pct(rate(c))}" aria-label="${longDate(s.date)}: ${pct(rate(c))}">
      <span class="tbar" style="height:100%">${['P', 'R', 'FJ', 'FNJ'].map(seg).join('')}</span></button>`;
  }).join('');
  const every = Math.max(1, Math.ceil(st.counted.length / 8));
  const labels = st.counted.map(({ s }, i) => `<span>${i % every === 0 ? ddmm(s.date) : ''}</span>`).join('');
  const minW = st.counted.length * 22 + 34;
  const trend = `<div class="section-title"><h2 class="h2">Sessió a sessió</h2><span class="eyebrow">toca per obrir</span></div>
    <div class="panel"><div class="trend-wrap"><div style="min-width:${minW}px">
      <div class="trend">${[100, 75, 50, 25].map(v => `<div class="grid" style="bottom:${v}%"><span>${v}%</span></div>`).join('')}${cols}</div>
      <div class="tlabels">${labels}</div></div></div>
      <div class="trend-note legend" style="margin:0;padding:0 14px 12px">${['P', 'R', 'FJ', 'FNJ'].map(k => `<span><i class="i-${k}"></i>${STATUS[k].short}</span>`).join('')}</div></div>`;

  const fnjAlert = st.rows.filter(r => r.FNJ >= (+S.config.alertFNJ || 3)).sort((a, b) => b.FNJ - a.FNJ);
  const alerts = fnjAlert.length ? `<div class="section-title"><h2 class="h2">Cal fer seguiment</h2><span class="eyebrow">≥ ${S.config.alertFNJ || 3} faltes no just.</span></div>
    <div class="panel"><ul class="alerts">${fnjAlert.map(r => `<li><span><b>${esc(r.m.name)}</b> <span class="muted">· ${SEC[r.m.section].name}</span></span><button class="pill fnj" data-act="member-stats" data-mid="${r.m.id}">${r.FNJ} FNJ</button></li>`).join('')}</ul></div>` : '';

  const sorters = { pct: 'Assistència', name: 'Nom', late: 'Retards' };
  const rows = [...st.rows].sort((a, b) => {
    if (ui.statsSort === 'name') return byName(a.m, b.m);
    if (ui.statsSort === 'late') return b.min - a.min || b.R - a.R;
    const ra = rate(a), rb = rate(b);
    return (ra ?? 2) - (rb ?? 2) || byName(a.m, b.m);
  });
  const table = `<div class="section-title"><h2 class="h2">Cantaires</h2>
      <div class="sortbar">${Object.entries(sorters).map(([k, l]) => `<button class="chip" style="min-height:30px;font-size:12.5px" aria-pressed="${ui.statsSort === k}" data-act="stats-sort" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="panel"><ul class="mtable">${rows.map(r => {
      const counted = r.P + r.R + r.FJ + r.FNJ;
      const rs = ruleMap.get(r.m.id);
      return `<li class="mrow"><button data-act="member-stats" data-mid="${r.m.id}">
        <span class="mname"><em>${r.m.section}</em><span>${esc(r.m.name)}</span>${rs && rs.status !== 'ok' ? `<span class="rule ${rs.status}">${rs.status === 'out' ? `&lt;${minAttendance()}%` : 'En risc'}</span>` : ''}</span>
        <span class="mpct">${counted ? pct(rate(r)) : (r.NP ? 'No fa' : '—')}</span>
        ${stackBar(r)}
        <span class="mcounts">
          <span><i class="i-P"></i><b>${r.P}</b></span>
          <span><i class="i-R"></i><b>${r.R}</b>${r.min ? ` · ${r.min}′` : ''}</span>
          <span><i class="i-FNJ"></i><b>${r.FNJ}</b></span>
          <span><i class="i-FJ"></i><b>${r.FJ}</b></span>
          ${r.NP ? `<span><i class="i-NP"></i><b>${r.NP}</b></span>` : ''}
        </span></button></li>`;
    }).join('')}</ul></div>`;

  return top + kpis + rule + dist + secBars + trend + alerts + table;
}

/* ---------- View: Manage ---------- */
function viewManage() {
  const pend = pendingAbsences().length;
  const tabs = [['avisos', `Avisos${pend ? ` (${pend})` : ''}`], ['cantaires', 'Cantaires'], ['produccions', 'Produccions'], ['config', 'Ajustos']];
  const head = `<div class="page-head"><h1 class="h1">Gestió</h1></div>
    <div class="subtabs" role="tablist" style="grid-template-columns:repeat(4,1fr)">${tabs.map(([k, l]) => `<button class="subtab" role="tab" aria-selected="${ui.manage === k}" data-act="manage" data-k="${k}" style="font-size:12.5px">${l}</button>`).join('')}</div>`;
  if (ui.manage === 'produccions') return head + manageProductions();
  if (ui.manage === 'config') return head + manageConfig();
  if (ui.manage === 'avisos') return head + manageAbsences();
  return head + manageMembers();
}
function leaveText(m) {
  const now = onLeave(m, TODAY);
  if (now) return `De baixa${now.to ? ` fins al ${ddmm(now.to)}` : ''}`;
  const next = (m.leaves || []).filter(l => l.from > TODAY).sort((a, b) => a.from.localeCompare(b.from))[0];
  return next ? `Baixa prevista des del ${ddmm(next.from)}` : '';
}
function manageMembers() {
  return SECTIONS.map(x => {
    const ms = membersOf(x.id, true);
    const active = ms.filter(m => m.active !== false).length;
    return `<div class="sec-h"><h2 class="h2"><em>${x.id}</em>${x.name} <span class="mono muted" style="font-size:13px;font-weight:400">${active}</span></h2>
      <span style="display:flex;gap:4px"><button class="btn btn-sm btn-ghost" data-act="member-bulk" data-sec="${x.id}">Afegeix</button></span></div>
      ${ms.length ? `<ul class="list">${ms.map(m => {
        const lv = leaveText(m);
        return `<li class="li"><button data-act="member-edit" data-mid="${m.id}">
        <span class="${m.active === false ? 'dim' : ''}"><span class="t">${esc(m.name)}</span>${m.part ? ` <span class="part">${esc(partTag(m))}</span>` : ''}${m.leader ? ' <span class="tag">Cap de corda</span>' : ''}
        ${m.active === false ? '<br><span class="s">Inactiu</span>' : lv ? `<br><span class="s">${lv}</span>` : m.phone ? `<br><span class="s mono">${esc(m.phone)}</span>` : ''}</span>
        <span class="icon-btn" aria-hidden="true">${ICON.go}</span></button></li>`;
      }).join('')}</ul>`
        : `<div class="panel" style="padding:14px;color:var(--muted);font-size:13.5px">Cap cantaire en aquesta corda.</div>`}`;
  }).join('');
}
function manageProductions() {
  const ps = productionsSorted();
  return `<div class="sec-h"><span class="muted" style="font-size:13.5px">${ps.length} produccions</span><button class="btn btn-sm btn-primary" data-act="prod-new">+ Producció</button></div>
    ${ps.length ? `<div style="display:grid;gap:10px">${ps.map(p => {
      const ss = allSessions(p.id);
      const shared = ss.filter(s => s.prodId !== p.id).length;
      const past = ss.filter(s => s.date <= TODAY).length;
      const status = p.end && p.end < TODAY ? 'Acabada' : p.start > TODAY ? 'Propera' : 'En curs';
      return `<div class="panel prod-card"><button data-act="prod-edit" data-pid="${p.id}" style="width:100%;text-align:left">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 class="h2" style="display:flex;align-items:center;gap:10px"><i class="pdot prod-tone" style="--ph:${prodHue(p)};width:14px;height:14px"></i>${esc(p.name)}</h2><span class="badge ${status === 'En curs' ? '' : 'soft'}">${status}</span></div>
        <div class="prod-meta"><span>${p.start ? shortDate(p.start) : '?'} – ${p.end ? shortDate(p.end) : '?'}</span><span><b>${ss.length}</b> sessions${shared ? ` (${shared} compartides)` : ''} · <b>${past}</b> fetes</span><span><b>${(p.excluded || []).length}</b> no la fan</span></div>
      </button></div>`;
    }).join('')}</div>` : `<div class="empty"><p>Crea la primera producció (p. ex. «Concert de Nadal») i genera’n les sessions d’assaig.</p></div>`}`;
}
function absenceCard(a, opts = {}) {
  const m = S.members.get(a.memberId);
  const dates = (a.sessionIds || []).map(sessionById).filter(Boolean).sort((x, y) => x.date.localeCompare(y.date));
  const label = { pending: 'Pendent', accepted: 'Acceptat', rejected: 'Rebutjat' }[a.status];
  const what = a.kind === 'late' ? `Arribarà tard${a.min ? ` (~${a.min}′)` : ''}` : 'No vindrà';
  let btns = '';
  if (opts.staff && canEdit()) {
    btns = a.status === 'pending'
      ? `<button class="btn btn-sm btn-primary" data-act="abs-accept" data-aid="${a.id}">Accepta</button><button class="btn btn-sm" data-act="abs-reject" data-aid="${a.id}">Rebutja</button>`
      : `<button class="btn btn-sm btn-danger-ghost" data-act="abs-delete" data-aid="${a.id}">Esborra</button>`;
  } else if (opts.mine && a.status === 'pending') {
    btns = `<button class="btn btn-sm btn-danger-ghost" data-act="abs-cancel" data-aid="${a.id}">Retira l’avís</button>`;
  }
  return `<div class="abs-card">
    <div class="a-h"><span><b>${esc(m?.name || a.memberName || '—')}</b> <span class="muted">· ${esc(SEC[a.section]?.name || '')} · ${what}</span></span><span class="st-pill st-${a.status}">${label}</span></div>
    <div class="a-d">${dates.map(s => `<span>${wdShort(s.date)} ${ddmm(s.date)}</span>`).join('') || '<span>Sessió esborrada</span>'}</div>
    ${a.reason ? `<div class="a-r">${esc(a.reason)}</div>` : ''}
    <div class="muted mono" style="font-size:11.5px">Enviat el ${a.createdAt ? (d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)} a les ${pad(d.getHours())}:${pad(d.getMinutes())}`)(new Date(a.createdAt)) : '—'}</div>
    ${btns ? `<div class="a-b">${btns}</div>` : ''}
  </div>`;
}
function manageAbsences() {
  const all = [...S.absences.values()].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const list = all.filter(a => ui.absFilter === 'all' || a.status === 'pending');
  return `<div class="sec-h"><div class="pickers">
      <button class="pick" aria-pressed="${ui.absFilter !== 'all'}" data-act="abs-filter" data-k="pending">Pendents</button>
      <button class="pick" aria-pressed="${ui.absFilter === 'all'}" data-act="abs-filter" data-k="all">Tots</button></div>
    <button class="btn btn-sm btn-primary" data-act="absence-new">+ Nou avís</button></div>
    ${list.length ? `<div class="panel">${list.map(a => absenceCard(a, { staff: true })).join('')}</div>`
      : `<div class="panel" style="padding:16px;font-size:13.5px;color:var(--muted)">${ui.absFilter === 'all' ? 'Encara no hi ha cap avís.' : 'No hi ha avisos pendents.'} Els cantaires poden avisar amb el seu enllaç (Ajustos › Enllaços).</div>`}`;
}

/* ================= Sheets ================= */
let sheetClose = null;
function openSheet({ title, body, foot = '', onMount, wide }) {
  closeSheet();
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-back" data-sheet-back>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide ? 'style="max-width:680px"' : ''}>
      <div class="sheet-h"><h2 class="h2">${esc(title)}</h2><button class="icon-btn" data-act="sheet-close" aria-label="Tanca">${ICON.close}</button></div>
      <div class="sheet-b">${body}</div>
      ${foot ? `<div class="sheet-f">${foot}</div>` : ''}
    </div></div>`;
  const back = root.firstElementChild;
  const prevFocus = document.activeElement;
  back.addEventListener('click', e => { if (e.target === back) closeSheet(); });
  const onKey = e => { if (e.key === 'Escape') closeSheet(); };
  document.addEventListener('keydown', onKey);
  document.body.style.overflow = 'hidden';
  sheetClose = () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; root.innerHTML = ''; prevFocus?.focus?.({ preventScroll: true }); };
  const first = back.querySelector('.sheet-b input:not([type=checkbox]):not([type=file]), .sheet-b textarea');
  if (onMount) onMount(back.querySelector('.sheet'));
  if (first && window.matchMedia('(hover:hover)').matches) first.focus();
  else back.querySelector('[data-act="sheet-close"]').focus({ preventScroll: true });
}
function closeSheet() { if (sheetClose) { const f = sheetClose; sheetClose = null; f(); } }

function confirmSheet(title, text, ok = 'Confirma', danger = true) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeSheet(); resolve(v); };
    openSheet({
      title, body: `<p style="margin:0">${text}</p>`,
      foot: `<button class="btn" id="cf-no">Cancel·la</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cf-yes">${esc(ok)}</button>`,
      onMount: el => {
        el.querySelector('#cf-no').onclick = () => finish(false);
        el.querySelector('#cf-yes').onclick = () => finish(true);
        const prev = sheetClose;
        sheetClose = () => { prev(); if (!done) { done = true; resolve(false); } };
      },
    });
  });
}

let toastTimer = null;
function toast(msg, action) {
  const root = $('#toast-root');
  clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button id="toast-act">${esc(action.label)}</button>` : ''}</div>`;
  if (action) $('#toast-act').onclick = () => { root.innerHTML = ''; action.run(); };
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, action ? 6000 : 2600);
}

/* ---------- Sheet: summary ---------- */
function summaryText(session, secs) {
  const prod = S.productions.get(session.prodId);
  const lines = [`${prodNames(session)} — ${session.type || 'Assaig'} ${ddmm(session.date)}${session.time ? ' ' + timeRange(session) : ''}`];
  for (const sec of secs) {
    if (!convoked(session, sec)) continue;
    const ms = membersOf(sec);
    const groups = { P: [], R: [], FNJ: [], FJ: [], NP: [], none: [] };
    for (const m of ms) { const mk = effMark(session, m); groups[mk ? mk.s : 'none'].push({ m, mk }); }
    lines.push('', `${SEC[sec].name.toUpperCase()} · ${groups.P.length + groups.R.length}/${ms.length - groups.NP.length} hi són`);
    if (groups.R.length) lines.push(`Retards: ${groups.R.map(({ m, mk }) => `${m.name}${mk.min ? ` (${mk.min}′)` : ''}`).join(', ')}`);
    if (groups.FNJ.length) lines.push(`Faltes no justificades: ${groups.FNJ.map(({ m, mk }) => m.name + (mk.note ? ` (${mk.note})` : '')).join(', ')}`);
    if (groups.FJ.length) lines.push(`Faltes justificades: ${groups.FJ.map(({ m, mk }) => m.name + (mk.note ? ` (${mk.note})` : '')).join(', ')}`);
    if (groups.none.length) lines.push(`Sense marcar: ${groups.none.map(({ m }) => m.name).join(', ')}`);
    if (!groups.R.length && !groups.FNJ.length && !groups.FJ.length && !groups.none.length) lines.push('Tothom present i puntual.');
  }
  return lines.join('\n');
}

      ${existing ? `<div class="toggle-row"><span><b>Enllaç personal</b><br><span class="muted" style="font-size:12.5px">${S.secretsMembers?.[m.id] ? 'Actiu' : 'Encara no en té'}</span></span><button type="button" class="btn btn-sm" data-act="member-link" data-mid="${m.id}">${S.secretsMembers?.[m.id] ? 'Envia’l' : 'Crea’l'}</button></div>` : ''}
      <label class="field"><span>Telèfon</span><input class="inp" id="me-phone" type="tel" maxlength="20" value="${esc(m.phone || '')}"></label>
      <label class="field"><span>Notes</span><input class="inp" id="me-notes" type="text" maxlength="120" value="${esc(m.notes || '')}"></label>
    </div>`,
    foot: `${existing ? '<button class="btn btn-danger-ghost" id="me-del">Esborra</button>' : ''}<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="me-save">Desa</button>`,
    onMount: el => {
      el.querySelectorAll('#me-sec .pick').forEach(b => b.onclick = () => { el.querySelectorAll('#me-sec .pick').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      el.querySelectorAll('#me-part .pick').forEach(b => b.onclick = () => { el.querySelectorAll('#me-part .pick').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      m.leaves = [...(m.leaves || [])];
      const drawLeaves = () => {
        el.querySelector('#me-leaves').innerHTML = m.leaves.length ? m.leaves.map((l, i) => `<div class="leave-row"><span><span class="mono">${ddmm(l.from)}/${l.from.slice(2, 4)} – ${l.to ? `${ddmm(l.to)}/${l.to.slice(2, 4)}` : 'sense data'}</span>${l.note ? ` · ${esc(l.note)}` : ''}</span><button type="button" class="icon-btn" data-lv="${i}" aria-label="Treu la baixa">${ICON.close}</button></div>`).join('') : '<span class="muted" style="font-size:13px">Cap baixa.</span>';
        el.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { m.leaves.splice(+b.dataset.lv, 1); drawLeaves(); });
      };
      drawLeaves();
      el.querySelector('#lv-add').onclick = () => {
        const from = el.querySelector('#lv-from').value, to = el.querySelector('#lv-to').value;
        if (!from || (to && to < from)) { toast('Indica una data d’inici (i un final posterior)'); return; }
        m.leaves.push({ from, to, note: el.querySelector('#lv-note').value.trim() });
        m.leaves.sort((a, b) => a.from.localeCompare(b.from));
        ['#lv-from', '#lv-to', '#lv-note'].forEach(q => { el.querySelector(q).value = ''; });
        drawLeaves();
      };
      el.querySelector('#me-save').onclick = () => {
        const name = el.querySelector('#me-name').value.trim();
        if (!name) { toast('Escriu el nom del cantaire'); return; }
        const section = el.querySelector('#me-sec .pick[aria-pressed="true"]').dataset.sec;
        if (existing && existing.section !== section && [...S.attendance.values()].some(d => d.section === existing.section && d.marks?.[m.id])) {
          toast('Canvi de corda desat. Les llistes antigues queden a la corda anterior.');
        }
        const next = { ...m, name, section, leader: el.querySelector('#me-leader').checked, active: el.querySelector('#me-active').checked, phone: el.querySelector('#me-phone').value.trim(), notes: el.querySelector('#me-notes').value.trim(), part: el.querySelector('#me-part .pick[aria-pressed="true"]').dataset.part };
        if (next.leader) for (const o of membersOf(section, true)) if (o.id !== next.id && o.leader) saveMember({ ...o, leader: false });
        saveMember(next);
        closeSheet();
        render();
      };
      const del = el.querySelector('#me-del');
      if (del) del.onclick = async () => {
        const ok = await confirmSheet('Esborrar el cantaire?', `S’esborrarà <b>${esc(existing.name)}</b> i deixarà de sortir a les estadístiques. Si només és una baixa, desactiva’l.`, 'Esborra');
        if (!ok) return;
        S.members.delete(existing.id); persist('members', existing.id, null, 20);
        revokePersonalLink(existing.id);
        toast('Cantaire esborrat');
        render();
      };
    },
  });
}

/* ---------- Sheet: member stats ---------- */

  if (!m) return;
  const scope = currentScope();
  const st = computeStats(scope, m.section);
  const rs = scope.kind === 'prod' ? ruleStatus(scope.id, m) : null;
  const r = st.rows.find(x => x.m.id === mid) || { ...emptyCounts(), hist: [], notes: [] };
  const hist = r.hist.map(({ s, mk }) => `<button class="hcell" data-act="open-session" data-sid="${s.id}" title="${longDate(s.date)} · ${mk ? STATUS[mk.s].label + (mk.min ? ` ${mk.min}′` : '') : 'Sense llista'}"><i class="${mk ? 's-' + mk.s : ''}"></i>${ddmm(s.date)}</button>`).join('');
  openSheet({
    title: m.name,
    body: `<div class="eyebrow" style="margin-bottom:10px">${SEC[m.section].name} · ${esc(scope.name)}</div>
      ${rs ? `<div class="notice" style="margin:0 0 12px;background:${rs.status === 'ok' ? 'var(--p-soft)' : rs.status === 'risk' ? 'var(--fj-soft)' : 'var(--fnj-soft)'};border:0">
        <b>${rs.status === 'ok' ? `Compleix la norma del ${minAttendance()}%` : rs.status === 'risk' ? 'En risc de no poder fer el concert' : 'No pot fer el concert'}</b>
        <span>Assistència als assajos: ${pct(rs.cur)} (${rs.att} de ${rs.att + rs.abs})${rs.remaining ? ` · queden ${rs.remaining} assajos, màxim possible ${pct(rs.best)}` : ''}.</span></div>` : ''}
      ${leaveText(m) ? `<p class="muted" style="margin:0 0 10px;font-size:13px">${leaveText(m)}</p>` : ''}
      <div class="kpis" style="grid-template-columns:repeat(2,1fr)">
        <div class="kpi"><div class="kpi-v">${pct(rate(r))}</div><div class="kpi-l">Assistència</div></div>
        <div class="kpi"><div class="kpi-v">${r.min}<small>min</small></div><div class="kpi-l">${r.R} retards</div></div>
        <div class="kpi ${r.FNJ ? 'alert' : ''}"><div class="kpi-v">${r.FNJ}</div><div class="kpi-l">Faltes no justificades</div></div>
        <div class="kpi"><div class="kpi-v">${r.FJ}</div><div class="kpi-l">Faltes justificades</div></div>
      </div>
      <div class="section-title" style="margin-top:20px"><h3 class="eyebrow">Sessió a sessió</h3></div>
      ${hist ? `<div class="hist">${hist}</div>` : '<p class="muted">Encara no hi ha sessions passades.</p>'}
      <div class="legend">${ORDER.map(k => `<span><i class="i-${k}"></i>${STATUS[k].short}</span>`).join('')}<span><i class="i-none"></i>Sense llista</span></div>
      ${r.notes.length ? `<div class="section-title" style="margin-top:20px"><h3 class="eyebrow">Motius registrats</h3></div>
      <ul class="notes-list">${r.notes.map(({ s, mk }) => `<li><span class="mono muted">${ddmm(s.date)}</span><span><span class="pill ${mk.s === 'FNJ' ? 'fnj' : ''}" style="${mk.s === 'FJ' ? 'background:var(--fj-soft);color:var(--ink)' : ''}">${mk.s}</span> ${esc(mk.note)}</span></li>`).join('')}</ul>` : ''}
      ${m.phone ? `<p style="margin-top:18px"><a class="btn btn-sm" href="tel:${esc(m.phone.replace(/\s/g, ''))}">Truca ${esc(m.phone)}</a></p>` : ''}`,
  });
}

/* ---------- Sheet: production ---------- */
function sheetProduction(pid) {
  const existing = pid ? S.productions.get(pid) : null;
  const d = existing ? clone(existing) : { id: uid('p'), name: '', start: TODAY, end: '', sessions: [], excluded: [] };
  d.sessions = d.sessions || []; d.excluded = d.excluded || [];
  const excluded = new Set(d.excluded);
  const gen = { from: d.start || TODAY, to: d.end || '', days: new Set(['1', '3']), time: '20:30', end: '22:30', type: 'Assaig', place: '' };

  const sessionsList = () => d.sessions.length
    ? `<ul class="mini-list" id="pe-sessions">${[...d.sessions].sort((a, b) => a.date.localeCompare(b.date)).map(s => `<li><span><span class="mono">${ddmm(s.date)} ${wdShort(s.date)}</span> · ${esc(s.type)} <span class="mono">${esc(timeRange(s))}</span></span><button class="icon-btn" data-rm="${s.id}" aria-label="Treu la sessió">${ICON.close}</button></li>`).join('')}</ul>`
    : '<p class="muted" style="margin:0;font-size:13.5px">Encara no hi ha sessions.</p>';

  openSheet({
    title: existing ? 'Edita la producció' : 'Nova producció', wide: true,
    body: `<div class="kv">
      <label class="field"><span>Nom</span><input class="inp" id="pe-name" type="text" maxlength="60" value="${esc(d.name)}" placeholder="p. ex. Concert de Nadal 2026"></label>
      <div class="field"><span>Color al calendari</span><div class="pickers" id="pe-hue">${PROD_HUES.map(h => `<button type="button" class="hue-pick prod-tone" style="--ph:${h}" data-hue="${h}" aria-pressed="${prodHue(d) === h}" aria-label="Color ${h}"></button>`).join('')}</div></div>
      <div class="row2"><label class="field"><span>Inici</span><input class="inp" id="pe-start" type="date" value="${d.start || ''}"></label>
      <label class="field"><span>Final</span><input class="inp" id="pe-end" type="date" value="${d.end || ''}"></label></div>

      <fieldset class="fieldset"><legend>Sessions</legend>
        <div id="pe-slist">${sessionsList()}</div>
        <details id="pe-gen" ${d.sessions.length ? '' : 'open'}><summary class="btn btn-sm" style="list-style:none;width:max-content">Genera sessions recurrents</summary>
          <div class="kv" style="margin-top:12px">
            <div class="row2"><label class="field"><span>Des de</span><input class="inp" id="g-from" type="date" value="${gen.from}"></label>
            <label class="field"><span>Fins a</span><input class="inp" id="g-to" type="date" value="${gen.to}"></label></div>
            <div class="field"><span>Dies</span><div class="pickers" id="g-days">${WEEKDAYS.map(([v, l]) => `<button type="button" class="pick" aria-pressed="${gen.days.has(v)}" data-d="${v}">${l}</button>`).join('')}</div></div>
            <div class="row2"><label class="field"><span>Hora d’inici</span><input class="inp" id="g-time" type="time" value="${gen.time}"></label>
            <label class="field"><span>Hora de final</span><input class="inp" id="g-end" type="time" value="${gen.end}"></label></div>
            <label class="field"><span>Tipus</span><select class="inp" id="g-type">${TYPES.map(t => `<option>${t}</option>`).join('')}</select></label>
            <label class="field"><span>Lloc</span><input class="inp" id="g-place" type="text" maxlength="60" placeholder="Sala d’assaig"></label>
            <button type="button" class="btn btn-sm btn-primary" id="g-run" style="width:max-content">Afegeix les sessions</button>
          </div></details>
      </fieldset>

      <fieldset class="fieldset"><legend>Qui no fa aquesta producció</legend>
        <p class="muted" style="margin:0;font-size:12.5px">Els marcats sortiran en gris («No fa») a totes les sessions i no comptaran a les estadístiques.</p>
        ${SECTIONS.map(x => { const ms = membersOf(x.id); return ms.length ? `<div class="field"><span>${x.name}</span><div class="pickers">${ms.map(mm => `<button type="button" class="pick" data-ex="${mm.id}" aria-pressed="${excluded.has(mm.id)}">${esc(mm.name)}</button>`).join('')}</div></div>` : ''; }).join('')}
      </fieldset>
    </div>`,
    foot: `${existing ? '<button class="btn btn-danger-ghost" id="pe-del">Esborra</button>' : ''}<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="pe-save">Desa</button>`,
    onMount: el => {
      const bindRm = () => el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { d.sessions = d.sessions.filter(s => s.id !== b.dataset.rm); el.querySelector('#pe-slist').innerHTML = sessionsList(); bindRm(); });
      bindRm();
      el.querySelectorAll('#g-days .pick').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
      el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
      el.querySelectorAll('#pe-hue .hue-pick').forEach(b => b.onclick = () => el.querySelectorAll('#pe-hue .hue-pick').forEach(x => x.setAttribute('aria-pressed', x === b)));
      el.querySelector('#pe-start').onchange = e => { if (!el.querySelector('#g-from').value || !d.sessions.length) el.querySelector('#g-from').value = e.target.value; };
      el.querySelector('#pe-end').onchange = e => { if (!el.querySelector('#g-to').value) el.querySelector('#g-to').value = e.target.value; };
      el.querySelector('#g-run').onclick = () => {
        const from = el.querySelector('#g-from').value, to = el.querySelector('#g-to').value;
        const days = new Set($$('#g-days .pick[aria-pressed="true"]', el).map(b => +b.dataset.d));
        if (!from || !to || to < from) { toast('Indica unes dates d’inici i final vàlides'); return; }
        if (!days.size) { toast('Tria almenys un dia de la setmana'); return; }
        const time = el.querySelector('#g-time').value, end = el.querySelector('#g-end').value, type = el.querySelector('#g-type').value, place = el.querySelector('#g-place').value.trim();
        const have = new Set(d.sessions.map(s => s.date + s.time));
        let n = 0;
        for (let dt = parseISO(from); isoDate(dt) <= to && n < 200; dt.setDate(dt.getDate() + 1)) {
          if (!days.has(dt.getDay())) continue;
          const iso = isoDate(dt);
          if (have.has(iso + time)) continue;
          d.sessions.push({ id: uid('s'), date: iso, time, end, type, place, note: '' }); n++;
        }
        el.querySelector('#pe-slist').innerHTML = sessionsList(); bindRm();
        toast(n ? `${n} sessions afegides. Recorda desar.` : 'No s’ha afegit cap sessió nova');
      };
      el.querySelector('#pe-save').onclick = () => {
        const name = el.querySelector('#pe-name').value.trim();
        if (!name) { toast('Posa un nom a la producció'); return; }
        d.name = name;
        d.start = el.querySelector('#pe-start').value || (d.sessions[0]?.date ?? TODAY);
        d.end = el.querySelector('#pe-end').value;
        d.excluded = $$('[data-ex][aria-pressed="true"]', el).map(b => b.dataset.ex);
        const hueBtn = el.querySelector('#pe-hue .hue-pick[aria-pressed="true"]');
        if (hueBtn) d.hue = +hueBtn.dataset.hue;
        d.sessions.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        const removed = (existing?.sessions || []).filter(s => !d.sessions.some(x => x.id === s.id));
        saveProduction(d);
        if (removed.length) removeMany(removed.flatMap(s => SECTIONS.map(x => ['attendance', attKey(s.id, x.id)])).filter(([, k]) => S.attendance.has(k)));
        closeSheet();
        toast(existing ? 'Producció desada' : 'Producció creada');
        render();
      };
      const del = el.querySelector('#pe-del');
      if (del) del.onclick = async () => {
        const ok = await confirmSheet('Esborrar la producció?', `S’esborraran <b>${esc(existing.name)}</b>, les seves ${(existing.sessions || []).length} sessions i tota l’assistència registrada.`, 'Esborra la producció');
        if (!ok) return;
        const att = (existing.sessions || []).flatMap(s => SECTIONS.map(x => ['attendance', attKey(s.id, x.id)])).filter(([, k]) => S.attendance.has(k));
        S.productions.delete(existing.id); persist('productions', existing.id, null, 20);
        await removeMany(att);
        toast('Producció esborrada');
        render();
      };
    },
  });
}

function sheetAbsence(presetSid) {
  const singer = S.role === 'singer';
  let memberId = singer ? myMemberId() : null;
  if (singer && !memberId) { toast('Aquest enllaç no està associat a cap cantaire'); return; }
  let kind = 'absent';
  const picked = new Set(presetSid ? [presetSid] : []);
  const sessionsFor = mid => {
    const m = S.members.get(mid);
    return m ? allSessions().filter(s => s.date >= TODAY && convoked(s, m.section)) : [];
  };
  openSheet({
    title: 'Avís d’absència',
    body: `<div class="kv">
      ${singer ? `<p style="margin:0">De part de <b>${esc(S.members.get(memberId).name)}</b></p>`
        : `<label class="field"><span>Cantaire</span><select class="inp" id="ab-member"><option value="">—</option>${memberOptions('')}</select></label>`}
      <div class="field"><span>Què passa?</span><div class="pickers" id="ab-kind">
        <button type="button" class="pick" data-k="absent" aria-pressed="true">No hi podré anar</button>
        <button type="button" class="pick" data-k="late" aria-pressed="false">Arribaré tard</button></div></div>
      <label class="field" id="ab-min-f" hidden><span>Minuts de retard aproximats</span><input class="inp" id="ab-min" type="number" inputmode="numeric" min="1" max="240" style="width:120px"></label>
      <div class="field"><span>Quins dies?</span><div id="ab-sessions"></div></div>
      <label class="field"><span>Motiu</span><textarea class="inp" id="ab-reason" maxlength="200" style="min-height:80px" placeholder="p. ex. Examen a la universitat"></textarea></label>
    </div>`,
    foot: `<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" id="ab-send">${singer ? 'Envia l’avís' : 'Desa l’avís'}</button>`,
    onMount: el => {
      const drawSessions = () => {
        const box = el.querySelector('#ab-sessions');
        if (!memberId) { box.innerHTML = '<span class="muted" style="font-size:13px">Tria primer el cantaire.</span>'; return; }
        const list = sessionsFor(memberId);
        if (!list.length) { box.innerHTML = '<span class="muted" style="font-size:13px">No hi ha sessions properes.</span>'; return; }
        let month = '', html = '<ul class="checklist">';
        for (const s of list) {
          const mo = s.date.slice(0, 7);
          if (mo !== month) { month = mo; html += `<li class="mo">${monthYear(s.date)}</li>`; }
          html += `<li><label><input type="checkbox" value="${s.id}" ${picked.has(s.id) ? 'checked' : ''}><span><b>${wdShort(s.date)} ${ddmm(s.date)}</b> · ${esc(s.type)}${s.time ? ` · <span class="mono">${esc(timeRange(s))}</span>` : ''}<br><span class="m">${esc(prodNames(s))}</span></span></label></li>`;
        }
        box.innerHTML = html + '</ul>';
        box.querySelectorAll('input').forEach(i => i.onchange = () => { i.checked ? picked.add(i.value) : picked.delete(i.value); });
        const first = box.querySelector('input:checked');
        if (first) setTimeout(() => first.closest('li').scrollIntoView({ block: 'nearest' }), 30);
      };
      drawSessions();
      const sel = el.querySelector('#ab-member');
      if (sel) sel.onchange = () => { memberId = sel.value || null; drawSessions(); };
      el.querySelectorAll('#ab-kind .pick').forEach(b => b.onclick = () => {
        kind = b.dataset.k;
        el.querySelectorAll('#ab-kind .pick').forEach(x => x.setAttribute('aria-pressed', x === b));
        el.querySelector('#ab-min-f').hidden = kind !== 'late';
      });
      el.querySelector('#ab-send').onclick = () => {
        const m = S.members.get(memberId);
        const reason = el.querySelector('#ab-reason').value.trim();
        const ids = [...picked].filter(id => sessionById(id));
        if (!m) { toast('Tria el cantaire'); return; }
        if (!ids.length) { toast('Marca almenys un dia'); return; }
        if (singer && !reason) { toast('Explica breument el motiu'); return; }
        const a = { id: uid('a'), uid: S.uid, memberId: m.id, memberName: m.name, section: m.section, sessionIds: ids, kind, reason,
          status: 'pending', createdAt: new Date().toISOString(), by: S.role };
        if (kind === 'late') { const v = parseInt(el.querySelector('#ab-min').value, 10); if (v > 0) a.min = Math.min(240, v); }
        closeSheet();

/* ---------- Calendar subscription ---------- */
const icsUrl = () => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}calendari.ics`;
function icsEscape(t) { return String(t || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function buildIcs(sessions, name) {
  const dt = (d, t) => `${d.replace(/-/g, '')}T${t.replace(':', '')}00`;
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cor Present//CA', 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${icsEscape(name)}`, 'X-WR-TIMEZONE:Europe/Madrid'];
  for (const s of sessions) {
    lines.push('BEGIN:VEVENT', `UID:${s.id}@cor-present`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`);
    if (s.time) {
      lines.push(`DTSTART;TZID=Europe/Madrid:${dt(s.date, s.time)}`);
      const end = s.end || `${pad(Math.min(23, +s.time.slice(0, 2) + 2))}:${s.time.slice(3, 5)}`;
      lines.push(`DTEND;TZID=Europe/Madrid:${dt(s.date, end)}`);
    } else {
      const next = new Date(parseISO(s.date).getTime() + 86400000);
      lines.push(`DTSTART;VALUE=DATE:${s.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${isoDate(next).replace(/-/g, '')}`);
    }
    lines.push(`SUMMARY:${icsEscape(`${s.type || 'Assaig'} · ${prodNames(s)}`)}`);
    if (s.place) lines.push(`LOCATION:${icsEscape(s.place)}`);
    const desc = [s.note, s.sections?.length ? `Convocats: ${s.sections.map(x => SEC[x].name).join(', ')}` : ''].filter(Boolean).join('\n');
    if (desc) lines.push(`DESCRIPTION:${icsEscape(desc)}`);
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* ---------- Brand ---------- */
function uploadLogo(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 256, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r) || max; c.height = Math.round(img.height * r) || max;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let data = c.toDataURL('image/png');
      if (data.length > 180000) data = c.toDataURL('image/webp', 0.85);
      if (data.length > 240000) { toast('La imatge és massa gran. Prova amb un PNG més senzill.'); return; }
      saveConfig({ brand: { ...(S.config.brand || {}), logo: data } });
      toast('Logotip desat'); render();
    };
    img.onerror = () => toast('No s’ha pogut llegir la imatge');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function offerFile(filename, text, mime) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch { toast('No s’ha pogut preparar el fitxer'); }
}
function exportJSON() {
  const data = { app: 'cor-present', version: 1, exportedAt: new Date().toISOString(), config: S.config,
    members: [...S.members.values()], productions: [...S.productions.values()], attendance: Object.fromEntries(S.attendance), absences: [...S.absences.values()] };
  offerFile(`cor-present-${TODAY}.json`, JSON.stringify(data, null, 2), 'application/json');
}
function exportCSV() {
  const scope = currentScope();
  if (!scope) return;
  const prod = { name: scope.name };
  const st = computeStats(scope, '');
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['Nom', 'Corda', 'Assistència %', 'Assisteix', 'Retard', 'Minuts retard', 'Falta no justificada', 'Falta justificada', 'No fa', ...st.sessions.map(s => `${s.date} ${s.type || ''}`)];
  const lines = [head.map(q).join(';')];
  for (const r of st.rows.sort((a, b) => a.m.section.localeCompare(b.m.section) || byName(a.m, b.m))) {
    const byS = new Map(r.hist.map(h => [h.s.id, h.mk]));
    const rt = rate(r);
    lines.push([r.m.name, SEC[r.m.section].name, rt == null ? '' : Math.round(rt * 100), r.P, r.R, r.min, r.FNJ, r.FJ, r.NP,
      ...st.sessions.map(s => { const mk = byS.get(s.id); return mk ? (mk.s === 'R' && mk.min ? `R${mk.min}` : mk.s) : ''; })].map(q).join(';'));
  }
  const slug = prod.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  offerFile(`assistencia-${slug}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
async function importJSON(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('El fitxer no és una còpia vàlida de Cor Present'); return; }
  if (!data || data.app !== 'cor-present' || !Array.isArray(data.members) || !Array.isArray(data.productions)) { toast('El fitxer no és una còpia vàlida de Cor Present'); return; }
  const ok = await confirmSheet('Restaurar la còpia?', `Se substituiran les dades actuals per ${data.members.length} cantaires i ${data.productions.length} produccions del fitxer.`, 'Restaura');
  if (!ok) return;
  applyData(data, false);
  toast('Còpia restaurada');
}
function applyData(data, demo) {
  const incoming = { members: new Map(data.members.map(m => [m.id, m])), productions: new Map(data.productions.map(p => [p.id, p])), attendance: new Map(Object.entries(data.attendance || {})) };
  for (const col of COLS) {
    for (const id of [...S[col].keys()]) if (!incoming[col].has(id)) { S[col].delete(id); persist(col, id, null, 10); }
  }
  let i = 0;
  for (const col of COLS) for (const [id, v] of incoming[col]) { S[col].set(id, v); persist(col, id, v, 10 + (i++ % 40) * 15); }
  saveConfig({ ...(data.config || {}), demo });
  ui.sessionId = null; ui.statsProd = null;
  render();
}
async function loadDemo() {
  try {
    const res = await fetch('demo.json', { cache: 'no-store' });

    applyData(await res.json(), true);
    ui.tab = 'llista'; render();
    toast('Dades d’exemple carregades');

}

  openSheet({
    title,
    body: `<p style="margin-top:0">${intro}</p>
      <textarea class="summary-pre" id="share-url" readonly style="min-height:90px;word-break:break-all">${esc(url)}</textarea>

    : 'S’eliminaran tots els cantaires, produccions i llistes. Fes abans una còpia de seguretat si en vols conservar res.', 'Esborra-ho');
  if (!ok) return;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const fn = actions[act];
  if (!fn) return;
  e.preventDefault();
  const subAllowed = SUB_OK.has(act) && canMark(sessionById(ui.sessionId), ui.rollSec || ui.section);
  if (EDIT_ONLY.has(act) && !canEdit() && !subAllowed) { toast('Amb aquest enllaç no pots fer aquesta acció'); return; }
  if (ADMIN_ONLY.has(act) && !isAdmin()) { toast('Només l’administració del cor pot fer-ho'); return; }
  fn(el, e);
});

function connect() {
  const base = `cors/${LINK.choirId}`;
  db = { doc: p => fs.doc(`${base}/${p}`), collection: p => fs.collection(`${base}/${p}`) };
  S.role = LINK.role;
  S.memberId = LINK.memberId || null;
  S.mode = 'shared';
  document.body.classList.toggle('ro', S.role !== 'edit');
  render();
  subscribe();
}
const waitForUser = () => new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
async function resolveLink(secret) {
  const snap = await fs.doc(`claus/${secret}`).get();
  if (!snap.exists) { const e = new Error('bad-link'); e.code = 'bad-link'; throw e; }
  const { choirId, role, memberId } = snap.data();
  const accRef = fs.doc(`cors/${choirId}/access/${S.uid}`);
  let acc = null;
  try { acc = await accRef.get(); } catch {}
  const want = { role, key: secret, at: new Date().toISOString(), ...(memberId ? { memberId } : {}) };
  if (!acc || !acc.exists || acc.data().key !== secret || acc.data().role !== role || (acc.data().memberId || '') !== (memberId || '')) {
    await accRef.set(want);
  }
  return { secret, choirId, role, ...(memberId ? { memberId } : {}) };
}
/** Signed in with Google: find which choir this person belongs to. */
async function resolveStaff(user) {
  const email = (user.email || '').toLowerCase();
  const idx = await fs.doc(`staffIndex/${email}`).get();
  if (!idx.exists) { const e = new Error('no-staff'); e.code = 'no-staff'; throw e; }
  const { choirId } = idx.data();
  const me = await fs.doc(`cors/${choirId}/staff/${email}`).get();
  if (!me.exists) { const e = new Error('no-staff'); e.code = 'no-staff'; throw e; }
  S.me = me.data();
  return { choirId, role: 'edit', via: 'google', email };
}
async function init() {
  loadUI();
  const cfg = window.COR_FIREBASE;
  if (!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).startsWith('POSA')) {
    S.mode = 'setup'; render(); return;
  }
  firebase.initializeApp(cfg);
  fs = firebase.firestore();
  // Offline cache: roll call keeps working in rehearsal rooms with poor signal.
  fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  auth = firebase.auth();
  S.mode = 'loading'; render();
  try { await auth.getRedirectResult(); } catch {}
  let user = auth.currentUser || await waitForUser();
  const secret = readSecret();
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(LS_LINK) || 'null'); } catch {}

  if (!secret && user && !user.isAnonymous) {
    S.uid = user.uid;
    try { LINK = await resolveStaff(user); try { localStorage.setItem(LS_LINK, JSON.stringify({ ...LINK, me: S.me })); } catch {} }
    catch (e) {
      if (e && e.code === 'no-staff') { S.mode = 'nostaff'; S.email = user.email; render(); return; }
      if (cached && cached.via === 'google' && cached.email === (user.email || '').toLowerCase()) { LINK = cached; S.me = cached.me || null; }
      else { S.mode = 'nokey'; render(); return; }
    }
    connect(); return;
  }
  if (!secret) { S.mode = 'nokey'; render(); return; }
  try {
    if (!user) user = (await auth.signInAnonymously()).user;
    S.uid = user.uid;
    rememberLink(await resolveLink(secret));
  } catch (e) {
    if (e && e.code === 'bad-link') { forgetLink(); S.mode = 'badlink'; render(); return; }
    if (cached && cached.secret === secret && auth.currentUser) { S.uid = auth.currentUser.uid; LINK = cached; }
    else { S.mode = 'badlink'; render(); return; }
  }
  connect();
}
async function signInGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    const cur = auth.currentUser;
    if (cur && cur.isAnonymous) {
      try { await cur.linkWithPopup(provider); }
      catch (e) {
        if (e.code === 'auth/credential-already-in-use' && e.credential) await auth.signInWithCredential(e.credential);
        else throw e;
      }
    } else {
      await auth.signInWithPopup(provider);
    }
  } catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
      forgetLink(); history.replaceState(null, '', location.pathname);
      await auth.signInWithRedirect(provider); return;
    }
    if (e.code !== 'auth/popup-closed-by-user') toast('No s’ha pogut entrar amb Google. Torna-ho a provar.');
    return;
  }
  forgetLink();
  history.replaceState(null, '', location.pathname);
  location.reload();
}
async function signOut() {
  if (!await confirmSheet('Tancar la sessió?', 'Aquest mòbil deixarà d’estar connectat al cor fins que tornis a entrar.', 'Tanca la sessió', false)) return;
  flushAll();
  forgetLink();
  try { await auth.signOut(); } catch {}
  location.replace(location.pathname);
}
async function createChoir() {
  S.mode = 'loading'; render();
  try {
    let user = auth.currentUser || await waitForUser();
    if (!user) user = (await auth.signInAnonymously()).user;
    S.uid = user.uid;
    const choirId = newKey(), at = new Date().toISOString();
    const secrets = { edit: newKey() };
    const b = fs.batch();
    b.set(fs.doc(`cors/${choirId}/config/main`), { name: '', alertFNJ: 3, minAttendance: 80, demo: false });
    b.set(fs.doc(`claus/${secrets.edit}`), { choirId, role: 'edit', at });
    b.set(fs.doc(`cors/${choirId}/access/${S.uid}`), { role: 'edit', key: secrets.edit, at });
    await b.commit();
    await fs.doc(`cors/${choirId}/secrets/main`).set(secrets);
    rememberLink({ secret: secrets.edit, choirId, role: 'edit' });
    ui.tab = 'gestio'; ui.manage = 'config';
    connect();
  } catch (e) {
    S.mode = 'nokey'; render();
    toast('No s’ha pogut crear el cor. Comprova la connexió i torna-ho a provar.');
  }
}
init();
})();
</script>
